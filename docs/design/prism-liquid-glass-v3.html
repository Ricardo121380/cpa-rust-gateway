<!doctype html>
<html lang="zh-CN" data-theme="light" data-lens="off">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Prism · Liquid Glass 工作空间</title>
<style>
/* Prism design tokens — docs/07 §8.2. Three-layer theming:
   :root (light) → @media prefers-color-scheme (dark) → [data-theme] override. */

:root {
  /* canvas / surface / ink */
  --canvas: #f2f2f7;
  --canvas-ambient: linear-gradient(160deg, #c8d8e8 0%, #e8e4f0 45%, #d4e4e0 100%);
  --surface: #ffffff;
  --surface-2: #f7f7fa;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  /* --ink-3 is NOT a body-text colour. It measures 3.26:1 on --surface and
     2.92:1 on --canvas, so any sentence a user has to read must use --ink-2
     (5.07:1) instead. Keep --ink-3 for non-text and incidental marks where AA
     does not apply: chart grid lines and axis ticks, the uppercase 11px column
     labels that repeat the data directly below them, status dots. An
     explanatory paragraph in --ink-3 is a bug — that is how .card-note shipped
     at 3.3:1. Raising the token is not the fix: any value clearing 4.5:1 on
     --surface-2 lands within 0.1 of --ink-2 and collapses the three-step ramp
     into two. */
  --ink-3: #8e8e93;
  --separator: rgba(0, 0, 0, 0.1);
  --tint: #0071e3;
  --tint-ink: #ffffff;
  /* Solid FILL behind --tint-ink. Separate from --tint because --tint has to
     stay bright enough to read as a label on a light surface (and doubles as
     --chart-1's hue), while a fill carrying 12-13px white text has to clear
     4.5:1 against white. In light mode the two coincide (#0071e3 measures
     4.70:1); in dark mode they cannot — see the dark block. */
  --tint-fill: #0071e3;

  /* status pool — badges only, never chart series */
  --status-good: #248a3d;
  --status-warn: #b7791f;
  --status-serious: #c93400;
  --status-critical: #d70015;

  /* categorical chart palette (validated light steps) */
  --chart-1: #0066d6;
  --chart-2: #b85f00;
  --chart-3: #0079ab;
  --chart-4: #c41e77;

  /* glass material (Regular variant) */

  /* Material semantics: config-version state, as glass (docs/07 §8.4).
     These are the SHIPPED values, measured on this shell — the earlier set
     (draft 28px/120%, active 14px/190%, archived 20px/80%) was authored before
     the ambient layer existed and read as three barely-distinguishable frosts
     once there was real content to refract. Both render paths consume these:
     --mat-*-blur/-sat for the layered fallback, --mat-*-frost/-lsat for the
     SVG lens, so a state can never move on one path and not the other. */
  --mat-draft-blur: 22px;
  --mat-draft-sat: 120%;
  --mat-draft-frost: 20;
  --mat-draft-lsat: 1.2;
  --mat-active-blur: 11px;
  --mat-active-sat: 195%;
  --mat-active-frost: 9;
  --mat-active-lsat: 1.85;
  --mat-archived-blur: 16px;
  --mat-archived-sat: 70%;
  --mat-archived-frost: 13;
  --mat-archived-lsat: 0.8;

  /* geometry: concentric radii — inner = outer − padding */
  --r-outer: 20px;
  --pad: 8px;
  --r-inner: calc(var(--r-outer) - var(--pad));

  /* motion */
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --dur: 200ms;
  --dur-anneal: 600ms;

  /* type */
  --font-text: -apple-system, "SF Pro Text", system-ui, "PingFang SC",
    "Hiragino Sans GB", sans-serif;
  --font-display: -apple-system, "SF Pro Display", system-ui, "PingFang SC",
    sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;

  /* ==== ambient + glass material (ported from proto/port) ==== */
  /* ---- ambient background ------------------------------------------------
     Glass with nothing behind it cannot look like glass. This is the "behind".
     Authored CSS/SVG only — no images, no CDN, CSP-clean.
     The prism streak is the single highest-value ingredient: it is the only
     layer with HUE variation at a SMALL spatial scale, and small-scale hue
     variation is exactly what refraction reveals. Four wide radial lights
     alone read as a flat pastel wash (tested: the rail looked like a card). */
  --amb-1: #5f9dff;   /* cool key light,  top-left  */
  --amb-2: #b98cff;   /* violet fill,     top-right */
  --amb-3: #3fd7bd;   /* teal bounce,     bottom    */
  --amb-4: #ffb877;   /* warm rim,        mid-right */
  --amb-strength-1: 0.42;
  --amb-strength-2: 0.38;
  --amb-strength-3: 0.34;
  --amb-strength-4: 0.26;
  --amb-streak: 0.32;  /* spectral fan crossing the rail column */
  --amb-grain: 0.40;  /* high-frequency bite for blur AND refraction */

  /* ---- glass body (treatment B — also the fallback for C) ---------------- */
  --glass-blur: 12px;      /* was 20px: 20 over-frosts and kills the backdrop */
  --glass-sat: 180%;
  --glass-bright: 1.06;
  --glass-contrast: 1.02;

  /* Vertical tint RAMP, not a flat fill. A flat rgba() body is the single
     biggest reason the old baseline reads as a card: a sheet of glass is never
     one uniform value. Light arrives from above, so the top edge carries more. */
  --glass-tint-top: rgba(255, 255, 255, 0.62);
  --glass-tint-mid: rgba(255, 255, 255, 0.44);
  --glass-tint-bot: rgba(255, 255, 255, 0.52);

  /* Specular ring — a MASKED GRADIENT BORDER, never a flat 1px line. A real
     rounded glass edge is lit at two opposing arcs and dark on the flanks. */
  --ring-w: 1px;
  --ring-1: rgba(255, 255, 255, 0.95);
  --ring-2: rgba(255, 255, 255, 0.42);
  --ring-3: rgba(255, 255, 255, 0.02);
  --ring-4: rgba(255, 255, 255, 0.55);
  --ring-5: rgba(255, 255, 255, 0.90);

  /* Inner bloom: 1px hairlines on both edges + two soft interior gradients */
  --glass-inner:
    inset 0 1px 0.5px rgba(255, 255, 255, 0.90),
    inset 0 -1px 0.5px rgba(255, 255, 255, 0.45),
    inset 0 14px 22px -20px rgba(255, 255, 255, 0.95),
    inset 0 -18px 26px -22px rgba(255, 255, 255, 0.60);

  /* Adaptive shadow: contact + near + mid + ambient. FOUR stops with negative
     spread — that is what reads as "floating above". One 32px blob does not. */
  --glass-shadow:
    0 1px 1px rgba(14, 18, 32, 0.05),
    0 4px 10px -3px rgba(14, 18, 32, 0.08),
    0 14px 28px -8px rgba(14, 18, 32, 0.12),
    0 30px 60px -22px rgba(14, 18, 32, 0.18);
  /* WWDC25: shadow opacity rises while real content is behind the pane */
  --glass-shadow-boost:
    0 1px 1px rgba(14, 18, 32, 0.07),
    0 5px 12px -3px rgba(14, 18, 32, 0.12),
    0 16px 32px -8px rgba(14, 18, 32, 0.18),
    0 34px 66px -22px rgba(14, 18, 32, 0.26);

  --glass-edge-top: rgba(255, 255, 255, 0.28);
  --glass-edge-bot: rgba(255, 255, 255, 0.14);

  /* ---- lens geometry (treatment C — read by <PrismLens>) ----------------- */
  --lens-bezel: 26;      /* px of bezel band measured in from the edge        */
  --lens-thickness: 34;  /* px of virtual glass thickness (drives strength)   */
  --lens-ior: 1.5;       /* refractive index of the virtual material          */
  --lens-gain: 1;        /* artistic multiplier on the computed scale         */
  --lens-rim-blur: 3;    /* stdDeviation applied BEFORE displacement.
                            0 => the rim shows a pin-sharp compressed image.
                            >=20 => the bend disappears entirely (verified:
                            the stripe test card stopped bending). 3 is the
                            usable window. */
}

@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0b0b10;
    --canvas-ambient: linear-gradient(160deg, #101826 0%, #181428 45%, #0e1e1e 100%);
    --surface: #16161d;
    --surface-2: #1e1e26;
    --ink: #f5f5f7;
    --ink-2: #98989d;
    --ink-3: #6e6e76;
    --separator: rgba(255, 255, 255, 0.1);
    --tint: #0a84ff;
    /* White 12-13px text on #0a84ff measures 3.65:1 — below AA. --tint itself
       must stay this bright (it is nav/link ink on a near-black surface, and
       --chart-1's hue), so the FILL darkens instead: white on #0f6fd6 is
       4.92:1. Same reading, same hue family, AA-clean. */
    --tint-fill: #0f6fd6;
    --status-good: #30d158;
    --status-warn: #ffd60a;
    --status-serious: #ff9f0a;
    --status-critical: #ff453a;
    --chart-1: #0a84ff;
    --chart-2: #cc7a00;
    --chart-3: #2196c9;
    --chart-4: #db4e92;
  --amb-1: #1e5fe0;
  --amb-2: #7c3aed;
  --amb-3: #0f9d8f;
  --amb-4: #c2560a;
  --amb-strength-1: 0.34;
  --amb-strength-2: 0.30;
  --amb-strength-3: 0.26;
  --amb-strength-4: 0.20;
  --amb-streak: 0.26;
  --amb-grain: 0.45;

  /* Dark glass: LESS saturation, MORE brightness. A dark pane over a dark
     canvas disappears unless it LIFTS the backdrop. */
  --glass-blur: 13px;
  --glass-sat: 165%;
  --glass-bright: 1.04;
  --glass-contrast: 1.04;
  --glass-tint-top: rgba(12, 12, 18, 0.52);
  --glass-tint-mid: rgba(12, 12, 18, 0.40);
  --glass-tint-bot: rgba(12, 12, 18, 0.48);
  --ring-1: rgba(255, 255, 255, 0.62);
  --ring-2: rgba(255, 255, 255, 0.20);
  --ring-3: rgba(255, 255, 255, 0.02);
  --ring-4: rgba(255, 255, 255, 0.24);
  --ring-5: rgba(255, 255, 255, 0.50);
  --glass-inner:
    inset 0 1px 0.5px rgba(255, 255, 255, 0.30),
    inset 0 -1px 0.5px rgba(255, 255, 255, 0.16),
    inset 0 16px 26px -24px rgba(255, 255, 255, 0.55),
    inset 0 -20px 30px -26px rgba(255, 255, 255, 0.35);
  --glass-shadow:
    0 1px 1px rgba(0, 0, 0, 0.30),
    0 5px 12px -4px rgba(0, 0, 0, 0.40),
    0 18px 36px -10px rgba(0, 0, 0, 0.45),
    0 40px 70px -24px rgba(0, 0, 0, 0.55);
  --glass-shadow-boost:
    0 1px 1px rgba(0, 0, 0, 0.40),
    0 6px 14px -4px rgba(0, 0, 0, 0.50),
    0 20px 40px -10px rgba(0, 0, 0, 0.55),
    0 44px 78px -24px rgba(0, 0, 0, 0.65);
  --glass-edge-top: rgba(255, 255, 255, 0.10);
  --glass-edge-bot: rgba(255, 255, 255, 0.05);
  }
}

/* ===========================================================================
   PORT 2/3 — replaces src/design/glass.css
   docs/07 §8.3. Glass is the functional layer only (rail / topbar / dock /
   sheet); the content canvas is always solid; never glass-on-glass; <=3 chrome
   panes per screen; Regular variant only.

   Layer order inside a pane (bottom -> top):
     backdrop-filter   the lens (C) or blur+saturate+brightness stack (B)
     ::after           wide edge bloom, z-index 0
     background-image  the vertical tint RAMP
     content           z-index 1
     ::before          specular ring (masked gradient border), z-index 2
   =========================================================================== */

.glass {
  position: relative;
  isolation: isolate;
  border-radius: var(--r-outer);
  border: 0;
  background-color: transparent;
  background-image: linear-gradient(
    to bottom,
    var(--glass-tint-top) 0%,
    var(--glass-tint-mid) 46%,
    var(--glass-tint-bot) 100%);
  -webkit-backdrop-filter:
    blur(var(--glass-blur)) saturate(var(--glass-sat))
    brightness(var(--glass-bright)) contrast(var(--glass-contrast));
  backdrop-filter:
    blur(var(--glass-blur)) saturate(var(--glass-sat))
    brightness(var(--glass-bright)) contrast(var(--glass-contrast));
  box-shadow: var(--glass-shadow), var(--glass-inner);
}
.glass > * { position: relative; z-index: 1; }

/* WWDC25: the shadow deepens while real content is passing under the pane.
   <PrismLens> sets data-over="content" | "ambient" from one elementFromPoint
   probe per pane per scroll frame. */
.glass[data-over="content"] {
  box-shadow: var(--glass-shadow-boost), var(--glass-inner);
}

/* Specular ring. NOT a 1px border: a gradient ring, bright at 10 and 4
   o'clock, extinguished on the flanks, painted into the border box by a
   xor/exclude mask. This is the second biggest difference from the baseline. */
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  padding: var(--ring-w);
  pointer-events: none;
  background: linear-gradient(147deg,
    var(--ring-1) 0%, var(--ring-2) 16%, var(--ring-3) 38%,
    var(--ring-3) 60%, var(--ring-4) 84%, var(--ring-5) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}

/* Wide edge bloom just inside the ring: the glass BODY catching the light.
   The two band HEIGHTS are parameterised (defaults unchanged) because a
   thicker slab has a wider lit rim: the modal layer widens them via
   --glass-edge-*-h instead of overriding this pseudo-element, which would
   out-specify the degradations below. */
.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(to bottom, var(--glass-edge-top) 0%, transparent var(--glass-edge-top-h, 18px)),
    linear-gradient(to top,    var(--glass-edge-bot) 0%, transparent var(--glass-edge-bot-h, 14px));
}

/* ---- C: true lensing -----------------------------------------------------
   C is B with the CSS backdrop-filter swapped for an SVG filter; every other
   layer is shared, so degrading to B is one property.

   The @supports ladder must exclude Firefox AND Safari: both PARSE
   `backdrop-filter: url(#x)` as valid and then render NOTHING at all, so
   @supports alone is not a capability test. <PrismLens> writes
   data-lens="on|off" as the runtime belt to this brace.
   -------------------------------------------------------------------------- */
@supports (backdrop-filter: url(#prism-lens-topbar))
      and (not (-moz-appearance: none))
      and (not (background: -webkit-named-image(i))) {
  html[data-lens="on"] .glass[data-pane="topbar"] {
    -webkit-backdrop-filter: url(#prism-lens-topbar);
    backdrop-filter: url(#prism-lens-topbar);
  }
  html[data-lens="on"] .glass[data-pane="rail"] {
    -webkit-backdrop-filter: url(#prism-lens-rail);
    backdrop-filter: url(#prism-lens-rail);
  }
  html[data-lens="on"] .glass[data-pane="dock"] {
    -webkit-backdrop-filter: url(#prism-lens-dock);
    backdrop-filter: url(#prism-lens-dock);
  }
  /* the SVG chain already blurs, saturates and brightens: pull the CSS tint
     back so the pane does not double-frost */
  html[data-lens="on"] .glass[data-pane] {
    background-image: linear-gradient(

/* ---- material semantics (docs/07 §8.4) ----------------------------------
   Material encodes config-version state. In C the same three states also move
   the lens: a draft is a THICKER, softer piece of glass. The numbers live in
   tokens.css so the two render paths cannot drift apart. */

   same --dur-anneal / --ease pair. */

const route=()=>location.hash.replace(/^#\/?/,'').split('?')[0]||'overview';

function accountDetail(id,tab='runtime'){const a=accounts.find(x=>x.id===id);if(!a)return;openModal(a.name,`<div class="detail-hero">${provider(a)}<div><h2>${a.name}</h2><p class="mono">${a.account}</p></div></div><div class="segment detail-tabs" role="tablist" aria-label="账号详情"><button role="tab" aria-selected="${tab==='runtime'}" data-action="account:${id}">运行状态</button><button role="tab" aria-selected="${tab==='entitlement'}" data-action="entitlement:${id}">权益证据</button><button role="tab" aria-selected="${tab==='bindings'}" data-action="bindings:${id}">配置与失败</button></div>`+(tab==='entitlement'?a.tier?`<div class="fact-grid">${fact('权益域',a.domain,true)}${fact('套餐',a.tier+' <span class="tag mono">'+a.tier.toLowerCase()+'</span>')}${fact('来源',a.source,true)}${fact('置信度',a.confidence,true)}${fact('观测时间','09 月 09 日 14:20（示例）')}${fact('来源范围','当前账号 · 当前权益域')}</div><div class="notice mt">套餐只描述当前权益域；目录与真实可调用模型仍分别判断。</div>`:empty('权益未观测','后端为 null 时保留未观测状态，不推断为 Free 或其他套餐。','','ShieldCheck'):tab==='bindings'?`<div class="fact-grid">${fact('Endpoint',`demo-ep-${a.channel}`,true)}${fact('Credential',`demo-cred-${id}`,true)}${fact('Channel',a.channel,true)}${fact('目录状态',badge(a.catalog))}</div><div class="line"></div><h3>失败证据</h3><p class="small muted mt">${a.failure?'安全分类：'+a.failure:'当前示例未观测到失败分类。没有记录不等于验证通过。'}</p><div class="row wrap mt">${link('monitoring?tab=failures&q='+encodeURIComponent(a.name),'查看失败','Activity')}${btn('目录详情','catalog:'+id,'BookOpen')}</div>`:`<div class="fact-grid">${fact('认证',badge(a.auth))}${fact('运行时',badge(a.runtime))}${fact('并发',`${a.inflight} / ${a.limit}`,true)}${fact('凭据到期',a.expires)}${fact('计划续期',a.refresh)}${fact('Quota 同步','未观测')}</div>${a.auth==='reauth_required'?`<div class="notice warn mt">此账号需要 operator 完成交互式重新授权。页面不会自动触发 OAuth 或 Autoreg。</div>`:''}<div class="line"></div><div class="row spread"><div><h3>模型目录</h3><p class="small muted">${a.observed?'最近观测 '+a.observed:'尚无目录成功观测'}</p></div>${btn('查看 target','catalog:'+id,'ChevronRight','quiet')}</div>`)+`<div class="modal-foot">${btn('关闭','close')}${btn('运行诊断','runtime:'+id,'Radio')}</div>`)}
function catalogDetail(id){const a=accounts.find(x=>x.id===id);if(!a)return;openModal('目录 target',`<div class="detail-hero">${provider(a)}<div><h2>${a.name}</h2><p>${a.channel} · ${badge(a.catalog)}</p></div></div><div class="fact-grid">${fact('Endpoint',`demo-ep-${a.channel}`,true)}${fact('Credential',`demo-cred-${id}`,true)}${fact('目录模型计数',a.count??'未观测')}${fact('Snapshot version',a.snapshot||'未观测',true)}${fact('最近成功观测',a.observed||'未观测')}${fact('Refresh due',a.due===null?'未观测':a.due?'是':'否')}${fact('最近失败分类',a.failure||'未观测',true)}${fact('最近失败时间',a.failure?'09 月 09 日 14:29（示例）':'未观测')}</div><div class="notice mt">这些信息来自目录状态投影；计数不表示当前访问组的授权后模型数。</div><div class="modal-foot">${btn('查看账号','account:'+id,'Users')}${btn('关闭','close')}</div>`)}

function pricesDetail(id){openModal('价格目录 · '+esc(id),`${scope('全局价格目录 · 示例')}<p class="small muted">以下为设计用价格值，单位 USD / 百万 token。</p><div class="mt">${table(['Exact model','输入','输出'],[['demo-model-build','1.00','3.00'],['demo-model-code','2.00','6.00'],['demo-model-chat','3.00','9.00']].map(x=>row(x)))}</div><div class="notice mt">生产价格由导入目录决定。无价格字段保留未观测，不使用这些示例作为默认价格。</div><div class="modal-foot">${btn('关闭','close')}</div>`)}
function upstreamDetail(id){const s=upstreams.find(x=>x.id===id);if(!s)return;openModal('上游连接 · '+esc(s.name),`<div class="fact-grid">${fact('Upstream ID',s.id,true)}${fact('Provider 类型',s.type,true)}${fact('协议',s.protocol,true)}${fact('出口策略','demo-egress-direct',true)}</div><div class="line"></div><div class="card-head"><h3>端点与凭据</h3>${btn('编辑连接','edit-upstream:'+id,'Settings2','compact')}</div><div class="info-list"><div class="info-row"><div><p>${s.channel}</p><small>Endpoint · ${esc(s.endpoint||'https://api.example.test')}</small></div><span class="tag">HTTPS</span></div><div class="info-row"><div><p>${s.credentials} 个已绑定凭据</p><small>列表与详情均不回显凭据秘密。</small></div>${link('accounts?provider='+s.provider,'查看账号','ChevronRight','btn quiet compact')}</div></div><div class="modal-foot">${btn('绑定凭据','bind-credential:'+id,'KeyRound')}${btn('关闭','close')}</div>`)}
function modelDetail(id){const m=publicModels.find(x=>x.id===id);if(!m)return;openModal('公开模型',`<div class="fact-grid">${fact('名称',esc(m.name))}${fact('Exact ID',m.id,true)}${fact('协议',m.protocol,true)}${fact('已知 Route ID',m.route,true)}</div><div class="line"></div><h3>配置关系</h3><div class="info-row mt"><div><p>路由</p><small>${m.route}</small></div>${btn('加载路由','route:'+m.route,'ChevronRight','quiet compact')}</div><div class="info-row"><div><p>模型别名</p><small>可以创建别名；完整枚举仍待契约支持。</small></div>${btn('创建别名','alias:'+id,'Plus','quiet compact')}</div><div class="modal-foot">${btn('编辑公开模型','edit-model:'+id,'Settings2')}${btn('关闭','close')}</div>`)}
function routeDetail(id){if(!/^demo-route-(build|code|chat)$/.test(id)){openModal('路由定位',empty('没有该路由的示例数据','当前示例可加载 demo-route-build、demo-route-code、demo-route-chat。',btn('加载示例路由','route:demo-route-build'),'Network'));return}openModal('路由 · '+esc(id),`<div class="fact-grid">${fact('配置版本',versionLabel())}${fact('Route ID',id,true)}${fact('路由状态','已加载单个已知路由')}${fact('候选列表','完整枚举待后端')}</div><div class="line"></div><h3>可以继续的操作</h3><p class="small muted mt">保留已完成的候选创建与 Explain。不能通过运营 inventory 推定全部草稿候选。</p><div class="row wrap mt">${btn('创建候选','create-candidate:'+id,'Plus')}${link('runtime?tab=explain&route='+id,'Route Explain','Network')}</div><div class="notice mt" data-kind="unwired">候选修改、删除与完整枚举未进入当前管理契约；正式实现需要后端 BE-FE-02。</div><div class="modal-foot">${btn('关闭','close')}</div>`)}
function groupDetail(id){const g=groups.find(x=>x.id===id);if(!g)return;openModal('访问组 · '+esc(g.name),`<div class="fact-grid">${fact('组 ID',g.id,true)}${fact('状态',badge(g.status,'启用'))}${fact('路由绑定',g.routes+' 条')}${fact('关联 Keys',g.keys+' 个')}</div><div class="line"></div><h3>授权路由</h3><div class="info-list mt">${publicModels.slice(0,g.routes).map(m=>`<div class="info-row"><div><p>${m.name}</p><small>${m.route}</small></div>${btn('查看路由','route:'+m.route,'ChevronRight','quiet compact')}</div>`).join('')}</div><div class="modal-foot">${btn('添加路由绑定','bind-route:'+id,'Plus')}${btn('编辑访问组','edit-group:'+id,'Settings2')}</div>`)}
function keyDetail(id){const k=keys.find(x=>x.id===id);if(!k)return;openModal('Client Key · '+esc(k.name),`<div class="fact-grid">${fact('Key ID',k.id,true)}${fact('显示前缀',k.prefix,true)}${fact('访问组',esc(k.group))}${fact('状态',badge(k.state,k.state==='active'?'启用':undefined))}</div><div class="notice mt">完整密钥无法再次读取。这里仅展示前缀和配置元数据。</div><div class="modal-foot">${btn(k.state==='active'?'停用 Key':'启用 Key','toggle-key:'+id,'ShieldCheck')}${btn('关闭','close')}</div>`)}
function egressDetail(id){const p=egressPolicies.find(x=>x.id===id);if(!p)return;openModal('出口策略 · '+esc(p.name),`<div class="fact-grid">${fact('策略 ID',p.id,true)}${fact('允许协议','HTTPS')}${fact('允许主机',p.hosts.map(esc).join(', '),true)}${fact('允许端口',p.ports,true)}${fact('重定向',p.redirect,true)}${fact('被引用',p.refs+' 个上游')}</div><div class="notice mt">策略约束是配置事实；真实出口状态请在 Provider 出口视图中检查。</div><div class="modal-foot">${btn('编辑策略','edit-egress:'+id,'Settings2')}${btn('关闭','close')}</div>`)}
function simpleForm(title,fields,submitLabel,kind,extra=''){openModal(title,`<form id="editor-form" data-kind="${kind}" class="stack">${fields}${extra}<p class="small muted">只演示当前页面内的配置变更，不发送管理 API 请求。</p><div class="modal-foot">${btn('取消','close')}<button type="submit" class="btn primary">${submitLabel}</button></div></form>`)}
function inputField(label,name,value='',help='',type='text'){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" value="${esc(value)}" type="${type}" required maxlength="120" autocomplete="off">${help?`<small>${help}</small>`:''}</div>`}

function validation(){versionState.validated=true;openModal('草稿校验 · 示例结果',`<div class="row spread"><h3>v25 · revision ${versionState.revision}</h3>${badge('fresh','示例校验通过')}</div><div class="line"></div><ol class="timeline"><li><b>配置引用完整</b><p>示例公开模型、路由与上游引用可以定位。</p></li><li><b>出口策略结构有效</b><p>示例主机与端口符合配置约束。</p></li><li><b>等待发布确认</b><p>配置校验不证明 Provider 的真实请求可用性。</p></li></ol><div class="notice mt">这是交互原型的固定校验样本，没有执行后端校验。</div><div class="modal-foot">${btn('返回草稿','close')}${btn('预览发布','publish','','primary')}</div>`);updateChrome()}
function publishConfirm(){openModal('发布配置 · 预览确认',`<div class="fact-grid">${fact('新活动版本','v25')}${fact('当前活动版本','v24')}${fact('待发布 revision',versionState.revision,true)}${fact('示例校验',versionState.validated?'已查看':'尚未查看')}</div><div class="notice mt">本次操作只切换设计稿中的版本状态。正式实现会替换正在服务的配置并写入审计。</div><div class="modal-foot">${btn('取消','close')}${btn(versionState.validated?'确认演示发布':'先查看校验',versionState.validated?'confirm-publish':'validate','','primary')}</div>`)}
function commandPalette(){openModal('前往工作区',`${search('搜索栏目','command-search','')}<div id="command-list" class="commands mt">${commandLinks('')}</div>`);document.getElementById('command-search')?.focus()}

function stateGallery(){openModal('页面状态样本',`<div class="stack">${card('加载中',`<p class="small muted">正在读取目录状态…</p><div class="skeleton"></div><div class="skeleton"></div>`)}${card('真空',`<p class="muted small">暂无账本记录；不能据此判断没有消费。</p>`)}${card('过滤后空',`<p class="muted small">没有符合当前条件的账号。</p><div class="mt">${btn('去账号池调整筛选','go-accounts','Search')}</div>`)}<div class="notice" data-kind="unwired"><b>管道未接线 / 能力待接入</b><br>以明确文案与虚线边界表达，不当作正常空数据。</div><div class="error-box"><h3>投影不可用</h3><p class="small muted mt">此部署未启用该运行时投影。停止自动轮询。</p></div><div class="error-box"><h3>读取失败</h3><p class="small muted mt">当前读取未成功；保留已选择的配置与筛选。</p><div class="mt">${btn('查看重试反馈','retry-state','RefreshCw')}</div></div><div class="error-box"><h3>会话失效</h3><p class="small muted mt">锁定工作区，清空会话中的秘密与受保护缓存。</p><div class="mt">${btn('查看解锁页','lock','LogIn')}</div></div></div>`)}
function handleAction(action){const[k,id]=action.split(':');switch(k){
case'close':closeModal();break;case'clear-filters':setParams({q:'',status:'',provider:'',freshness:''});break;case'account':accountDetail(id);break;case'entitlement':accountDetail(id,'entitlement');break;case'bindings':accountDetail(id,'bindings');break;case'catalog':catalogDetail(id);break;case'runtime':runtimeDetail(id);break;case'request':requestDetail(id);break;case'prices':pricesDetail(id);break;case'upstream':upstreamDetail(id);break;case'model':modelDetail(id);break;case'route':routeDetail(id);break;case'group':groupDetail(id);break;case'key':keyDetail(id);break;case'egress':egressDetail(id);break;
case'theme':setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');break;case'appearance':setTheme(id);break;case'pref':prefs[id]=!prefs[id];document.documentElement.dataset[id]=prefs[id]?(id==='contrast'?'more':'reduce'):'normal';renderPage();break;case'nav-toggle':{const rail=document.querySelector('.rail');const on=rail.dataset.open!=='true';rail.dataset.open=String(on);document.querySelector('.mobile-menu')?.setAttribute('aria-expanded',String(on));refreshLenses();break}case'search':commandPalette();break;case'lock':closeModal();location.hash='#/unlock';break;case'unlock':location.hash='#/overview';break;case'go-accounts':closeModal();location.hash='#/accounts';break;case'state-gallery':stateGallery();break;case'retry-state':openModal('重试后的示例',empty('目录已重新读取','当前样本从读取失败恢复到已加载状态。',link('catalog','查看目录','ArrowRight'),'CircleCheck'));break;

case'add-account':simpleForm('添加账号 · 连接方式',selectField('平台','provider',[['grok','Grok'],['codex','Codex'],['claude','Claude'],['api','Compatible API']])+selectField('接入方式','method',[['existing','绑定已导入凭据'],['oauth','交互式 OAuth 授权'],['key','API Key']]),'查看接入步骤','add-account');break;

case'usage-help':openModal('用量观测口径',`<div class="stack"><p>单行是指定范围与维度组合的聚合，不是一个时间桶。</p><p class="muted">输入、输出、推理、缓存读取、缓存创建和聚合缓存各自保留 confidence。缺失值不按零计入；不同缓存类型也不直接合并。</p><div class="notice">金额属于账本。用量投影的 unpriced 只表示未定价。</div>${link('monitoring?tab=ledger','查看计费账本','Receipt')}</div>`);break;

case'version-diff':openModal('草稿差异 · 设计样本',`${table(['对象','变化'],[row(['公开模型','新增 demo-model-build 绑定']),row(['出口策略','允许主机更新为 api.example.test']),row(['价格策略','绑定 demo-prices-sep'])])}<div class="notice mt">这是用于展示差异层次的固定样本；不是当前网关或所有页面内编辑的自动 diff。</div><div class="modal-foot">${btn('查看校验结果','validate','CircleCheck','primary')}</div>`);break;

const N = 200; // profile samples along one radius
/** Apple's squircle profile: y = (1-(1-x)^4)^(1/4).
 *  Softer flat->curve transition than a circular arc, so the refraction
 *  gradient stays smooth when the shape is stretched into a long rectangle.
 *  A plain circle produced a visible hard seam where the bezel met the flat
 *  interior on the 1416px-wide topbar. */
const squircle = (x) => Math.pow(1 - Math.pow(1 - x, 4), 0.25);
/** Snell–Descartes along one radius: air (n=1) -> glass (n=ior).
 *  t = 0 at the outer edge, 1 at the end of the bezel. Magnitudes come back
 *  normalised to 1, and `max` is the px scale to hand to feDisplacementMap —
 *  which is exactly what the `scale` attribute means. */
function profile(bezel, thickness, ior) {
    const mags = [];
    for (let i = 0; i < N; i += 1) {
        const t = i / (N - 1);
        const d = 1e-3;
        const slope = ((squircle(Math.min(1, t + d)) - squircle(Math.max(0, t - d))) / (2 * d)) *
            (thickness / bezel);
        const theta1 = Math.atan(slope);
        const theta2 = Math.asin(Math.max(-1, Math.min(1, Math.sin(theta1) / ior)));
        // the (1 - .55*height) term fades the bend as the glass flattens out
        mags.push(Math.tan(theta1 - theta2) * thickness * (1 - squircle(t) * 0.55));
    }
    const max = Math.max(...mags, 1e-6);
    return { mags: mags.map((m) => m / max), max };
}
/** R = x displacement, G = y displacement, B = bezel coverage (the rim mask —
 *  feDisplacementMap ignores B and A, so the mask rides in the same image and
 *  costs nothing). 128 is neutral in R/G. */
function buildMap(w, h, radius, bezel, thickness, ior) {
    const c = document.createElement("canvas");
    c.width = Math.max(2, Math.round(w));
    c.height = Math.max(2, Math.round(h));
    const ctx = c.getContext("2d");
    if (ctx === null)
        return { url: "", scale: 0 };
    // CLAMP THE BEZEL TO THE PANE'S SHORT SIDE.
    // The rim band is the SHARP, displaced backdrop composited OVER the frost.
    // A bezel wider than half the short side therefore covers the whole pane,
    // the frost never shows, and what looks like glass is really a clear window
    // that leaks every glyph underneath at full contrast.
    // Measured on this shell at the nominal 26px bezel:
    //   rail   196x810  rim =   6% of height   correct
    //   topbar 1416x54  rim =  96% of height   BROKEN
    //   dock    545x51  rim = 100% of height   BROKEN
    // Fixing this dropped measured glyph energy under the dock from 4.28 to
    // 1.49, against an ambient-only floor of 1.42.
    const bez = Math.max(4, Math.min(bezel, Math.min(c.width, c.height) * 0.3));
    const img = ctx.createImageData(c.width, c.height);
    const { mags, max } = profile(bez, thickness, ior);
    const r = Math.min(radius, c.width / 2, c.height / 2);
    for (let y = 0; y < c.height; y += 1) {
        for (let x = 0; x < c.width; x += 1) {
            const px = x + 0.5;
            const py = y + 0.5;
            // signed distance to a rounded rect + its outward normal
            const cx = Math.min(Math.max(px, r), c.width - r);
            const cy = Math.min(Math.max(py, r), c.height - r);
            let nx = px - cx;
            let ny = py - cy;
            let dist;
            const len = Math.hypot(nx, ny);
            if (len < 1e-6) {
                const dl = px, dr = c.width - px, dt = py, db = c.height - py;
                dist = Math.min(dl, dr, dt, db);
                if (dist === dl) {
                    nx = -1;
                    ny = 0;
                }
                else if (dist === dr) {
                    nx = 1;
                    ny = 0;
                }
                else if (dist === dt) {
                    nx = 0;
                    ny = -1;
                }
                else {
                    nx = 0;
                    ny = 1;
                }
            }
            else {
                dist = r - len;
                nx /= len;
                ny /= len;
            }
            const t = Math.min(1, Math.max(0, dist / bez));
            const mag = mags[Math.min(N - 1, Math.round(t * (N - 1)))] ?? 0;
            // rim coverage: 1 across the bezel, smoothstepped to 0 just inside it
            const u = Math.min(1, Math.max(0, 1 - t));
            const cover = u * u * (3 - 2 * u);
            const i = (y * c.width + x) * 4;
            img.data[i] = Math.round(128 + nx * mag * 127);
            img.data[i + 1] = Math.round(128 + ny * mag * 127);
            img.data[i + 2] = Math.round(cover * 255);
            img.data[i + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    return { url: c.toDataURL("image/png"), scale: max };
}
const PANES = [
    { sel: ".topbar", id: "prism-lens-topbar" },
    { sel: ".rail", id: "prism-lens-rail" },
    { sel: ".dock", id: "prism-lens-dock" },
];
function num(el, name, fallback) {
    const v = Number.parseFloat(getComputedStyle(el).getPropertyValue(name));
    return Number.isFinite(v) ? v : fallback;
}
/** ms from a CSS duration token ("600ms" / "0.6s" / "0ms"). */
function durationMs(el, name) {
    const raw = getComputedStyle(el).getPropertyValue(name).trim();
    const v = Number.parseFloat(raw);
    if (!Number.isFinite(v))
        return 0;
    return raw.endsWith("ms") ? v : v * 1000;
}
function applyDynamics(f, d) {
    // negative scale = sample OUTWARD (physically correct convex lens)
    f.querySelector("feDisplacementMap")?.setAttribute("scale", (-d.scale).toFixed(2));
    const blurs = f.querySelectorAll("feGaussianBlur");
    blurs[0]?.setAttribute("stdDeviation", d.frost.toFixed(2));
    blurs[1]?.setAttribute("stdDeviation", d.rim.toFixed(2));
    f.querySelector('feColorMatrix[type="saturate"]')?.setAttribute("values", d.sat.toFixed(3));
}
/** cubic-bezier(0.32, 0.72, 0, 1) — the shell's --ease, sampled by bisection.
 *  Hard-coded rather than parsed: this is the one easing the design system
 *  defines, and the CSS transition on the layered path uses the same curve, so
 *  both paths anneal on the same clock AND the same shape. */
function ease(t) {
    const bx = (u) => 3 * u * (1 - u) ** 2 * 0.32 + u ** 3;
    const by = (u) => 3 * u * (1 - u) ** 2 * 0.72 + 3 * u ** 2 * (1 - u) + u ** 3;
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 24; i += 1) {
        const mid = (lo + hi) / 2;
        if (bx(mid) < t)
            lo = mid;
        else
            hi = mid;
    }
    return by((lo + hi) / 2);
}
/** Live tween per filter id, so a second material change mid-anneal replaces
 *  the first instead of racing it. */
const tweens = new Map();
/** SVG filter primitives are attributes, not animatable CSS properties, so the
 *  `transition: backdrop-filter` that anneals the layered path is a no-op here:
 *  under `backdrop-filter: url(#...)` a draft->active publish snapped between
 *  two frost levels in a single frame. Tween the primitive values on the same
 *  duration and easing token instead. */
function annealTo(f, id, from, to, ms) {
    const running = tweens.get(id);
    if (running !== undefined)
        cancelAnimationFrame(running);
    const t0 = performance.now();
    const step = (now) => {
        const p = Math.min(1, (now - t0) / ms);
        const k = ease(p);
        applyDynamics(f, {
            scale: from.scale + (to.scale - from.scale) * k,
            frost: from.frost + (to.frost - from.frost) * k,
            rim: from.rim + (to.rim - from.rim) * k,
            sat: from.sat + (to.sat - from.sat) * k,
        });
        if (p < 1)
            tweens.set(id, requestAnimationFrame(step));

            tweens.delete(id);

}
function updatePane({ sel, id }) {
    const el = document.querySelector(sel);
    const f = document.getElementById(id);
    if (el === null || f === null)
        return;
    const rect = el.getBoundingClientRect();
    if (rect.width < 4 || rect.height < 4)
        return;
    const cs = getComputedStyle(el);
    const radius = Number.parseFloat(cs.borderTopLeftRadius) || 20;
    const bezel = num(el, "--lens-bezel", 26);
    const thickness = num(el, "--lens-thickness", 34);
    const ior = num(el, "--lens-ior", 1.5);
    const gain = num(el, "--lens-gain", 1);
    const key = [
        Math.round(rect.width), Math.round(rect.height),
        radius, bezel, thickness, ior,
    ].join("/");
    if (f.dataset.key !== key) {
        const { url, scale } = buildMap(rect.width, rect.height, radius, bezel, thickness, ior);
        f.dataset.key = key;
        f.dataset.scale = String(scale);
        const im = f.querySelector("feImage");
        im?.setAttribute("href", url);
        im?.setAttribute("width", String(Math.round(rect.width)));
        im?.setAttribute("height", String(Math.round(rect.height)));
    }
    // --lens-frost / --lens-sat are what data-material actually overrides, so they
    // must be re-read on every call, not only when the map is rebuilt.
    const target = {
        scale: Number.parseFloat(f.dataset.scale ?? "0") * gain,
        frost: num(el, "--lens-frost", 10),
        rim: num(el, "--lens-rim-blur", 3),
        sat: num(el, "--lens-sat", 1.8),
    };
    const prev = f.dataset.dyn;
    const next = `${target.scale}/${target.frost}/${target.rim}/${target.sat}`;
    if (prev === next)
        return;
    f.dataset.dyn = next;
    const anneal = durationMs(el, "--dur-anneal");
    const from = prev?.split("/").map(Number);
    if (from === undefined || from.length !== 4 ||
        from.some((n) => !Number.isFinite(n)) || anneal <= 0) {
        applyDynamics(f, target);
        return;
    }
    annealTo(f, id, { scale: from[0] ?? 0, frost: from[1] ?? 0, rim: from[2] ?? 0, sat: from[3] ?? 0 }, target, anneal);
}
/** WWDC25 deepens the shadow while real content is behind the pane.
 *  One elementFromPoint per pane per scroll frame — cheap. */
function updateOver() {
    for (const { sel } of PANES) {
        const el = document.querySelector(sel);
        if (el === null)
            continue;
        const r = el.getBoundingClientRect();
        const probe = document.elementFromPoint(Math.min(window.innerWidth - 2, r.left + r.width / 2), Math.max(2, Math.min(window.innerHeight - 2, r.top + r.height + 6)));
        const over = probe !== null && probe.closest(".canvas") !== null;
        el.dataset.over = over ? "content" : "ambient";
    }
}
