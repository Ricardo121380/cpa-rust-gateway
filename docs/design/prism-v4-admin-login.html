<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism · 管理员登录</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--ink:#1d1d1f;--muted:#626269;--line:#86868b;--card:rgba(255,255,255,.8);--field:#fff;--blue:#0071e3}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink)}main{min-height:100svh;display:grid;place-items:center;padding:32px 12px;isolation:isolate}main:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,#dce5f055,transparent 60%),radial-gradient(ellipse at 80% 75%,#e3e8ed77,transparent 50%)}.card{width:min(400px,100%);padding:32px;border:1px solid #ffffff80;border-radius:28px;background:var(--card);backdrop-filter:blur(28px);box-shadow:0 16px 48px #28364710,0 2px 6px #28364708}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:-.6px;margin-bottom:28px}.brand svg{width:25px;height:25px}h1{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.8px;margin:0 0 26px}form{display:grid;gap:18px}label{display:grid;gap:8px;font-size:13px;font-weight:500}.field{position:relative}input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:16px inherit;font-size:16px}input[type=password],input.revealed{padding-right:48px}button{font:inherit;cursor:pointer}button.eye{position:absolute;right:3px;top:2px;width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;color:var(--muted);border-radius:10px}.eye svg{width:19px;height:19px}button.primary{height:48px;margin-top:6px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-size:15px;font-weight:600}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.note{font-size:13px;color:var(--muted);margin:-12px 0 22px}.error{font-size:13px;color:#bc2029;margin:0}.back{background:transparent;border:0;color:var(--muted);height:44px;font-size:13px}.hidden{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#171719;--ink:#f5f5f7;--muted:#aaaab0;--line:#86868b;--card:#29292dd9;--field:#242427;--blue:#0071e3}.card{border-color:#ffffff18;box-shadow:0 20px 60px #0003}main:before{opacity:.13}.error{color:#ff8c92}}
@media(prefers-reduced-transparency:reduce){.card{backdrop-filter:none;background:var(--bg)}}@media(prefers-contrast:more){.card,input{border-color:var(--ink)}.note,.back{color:var(--ink)}}@media(max-width:440px){.card{padding:28px 24px}}
</style>
<main><section class="card"><div class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 2 26 14 14 26 2 14Z" stroke="currentColor" stroke-width="1.5"/><path d="M14 2v24M2 14h24" stroke="currentColor" stroke-opacity=".25"/></svg>Prism</div><h1 id="title">管理员登录</h1><p class="note hidden" id="note">首次登录，请设置你的新密码。</p><form><label id="account">账号<input name="username" autocomplete="username" value="admin"></label><label id="current">密码<span class="field"><input name="password" type="password" autocomplete="current-password"><button type="button" class="eye" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label><label class="hidden" id="new">新密码<input type="password" autocomplete="new-password" placeholder="至少 12 个字符"></label><label class="hidden" id="confirm">确认新密码<input type="password" autocomplete="new-password"></label><p role="alert" class="error hidden" id="error">账号或密码不正确</p><button type="submit" class="primary" id="submit">登录</button><button type="button" class="back hidden" id="back">返回登录</button></form></section></main>
<script>
const change=location.hash.includes('first-password');for(const id of ['new','confirm','note','back'])document.getElementById(id).classList.toggle('hidden',!change);document.getElementById('account').classList.toggle('hidden',change);if(change){document.getElementById('title').textContent='设置新密码';document.getElementById('submit').textContent='保存并重新登录';document.getElementById('current').firstChild.textContent='初始密码'}document.getElementById('error').classList.toggle('hidden',!location.hash.includes('error'));document.querySelector('form').onsubmit=e=>e.preventDefault();document.querySelector('.eye').onclick=e=>{const b=e.currentTarget,i=b.previousElementSibling,on=i.type==='password';i.type=on?'text':'password';i.classList.toggle('revealed',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'隐藏密码':'显示密码')};document.getElementById('back').onclick=()=>{location.hash='';location.reload()};
</script></html>
