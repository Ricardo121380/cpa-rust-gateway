<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism · Liquid Glass V5</title>
<style>
:root{color-scheme:light;--bg:#e4eaf0;--ink:#202832;--muted:#536273;--line:#637b931f;--blue:#0071e3;--pane:#f7fbff7a;--inner:#ffffff52;--shine:#ffffffdf;--shade:#374e6a12;--input:#ffffff86;--green:#248044}
html[data-theme=dark]{color-scheme:dark;--bg:#17212d;--ink:#eff4fa;--muted:#b1bfce;--line:#d2e3ff20;--blue:#8dc5ff;--pane:#26354862;--inner:#d2e3ff08;--shine:#e6f1ff32;--shade:#030b1850;--input:#233247aa;--green:#7ddd9a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:radial-gradient(ellipse at 9% 10%,#8eb8e844,transparent 58%),radial-gradient(ellipse at 90% 100%,#88a9c34a,transparent 58%),var(--bg);min-height:100svh}button,input,a{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--input);border-radius:11px;padding:9px 14px}button:hover{border-color:var(--blue)}button.primary{background:#0071e3;color:white;border-color:transparent;box-shadow:0 3px 7px #0065ce20}a{color:var(--blue);text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;font-weight:650;margin-bottom:9px}h2{font-size:17px;letter-spacing:-.3px;font-weight:600;margin-bottom:18px}h3{font-size:14px;font-weight:600;margin-bottom:6px}.muted{color:var(--muted)}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.glass{background:linear-gradient(150deg,var(--pane),transparent 110%);border:1px solid var(--shine);box-shadow:inset 0 1px 0 var(--shine),0 12px 36px -18px var(--shade);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%)}
.topbar{position:fixed;top:14px;left:14px;right:14px;height:58px;z-index:5;border-radius:18px;display:flex;gap:18px;align-items:center;padding:0 20px}.brand{font-size:20px;font-weight:650;letter-spacing:-.6px;width:192px;flex-shrink:0}.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-weight:550}.context{margin-left:auto;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--inner);color:var(--ink)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:2px}.theme{padding:6px 12px;background:transparent;font-size:12px}.rail{position:fixed;top:86px;left:14px;bottom:14px;width:208px;border-radius:20px;padding:18px 10px;overflow-y:auto}.rail small{display:block;font-size:11px;color:var(--muted);padding:0 13px 7px;letter-spacing:.5px}.rail small:not(:first-child){margin-top:20px}.rail a{display:flex;gap:11px;align-items:center;color:var(--muted);padding:9px 13px;border-radius:11px;margin-bottom:2px;font-size:13px}.rail a.on{background:linear-gradient(110deg,#1685f91f,#1685f908);box-shadow:inset 0 0 0 1px #87bdfa28;color:var(--ink);font-weight:600}.rail a svg{width:17px;height:17px;opacity:.8;flex-shrink:0}.rail a:hover{background:var(--inner)}.workspace{margin:86px 14px 14px 240px;min-height:calc(100svh - 100px);border-radius:24px;padding:30px;background:linear-gradient(145deg,var(--pane),transparent 100%);border:1px solid var(--shine);box-shadow:inset 0 1px 0 var(--shine),0 18px 45px -25px var(--shade);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head p{margin:0;font-size:13px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}.panel{border:1px solid var(--line);border-top-color:var(--shine);border-radius:18px;background:linear-gradient(150deg,var(--inner),transparent 140%);box-shadow:inset 0 1px 0 var(--shine),0 5px 16px -12px var(--shade);overflow:hidden}.pad{padding:22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px}.metric{padding:22px 24px}.metric+.metric{border-left:1px solid var(--line)}.label{color:var(--muted);font-size:12px}.value{font-size:35px;letter-spacing:-1.3px;font-weight:600;margin:8px 0 7px;font-variant-numeric:tabular-nums}.note{color:var(--muted);font-size:12px}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.section-title h2{margin:0}.section-title a{font-size:12px}.resource-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.resource-grid strong{display:block;font-size:24px;font-weight:550;margin-bottom:6px}.resource-grid a{color:var(--ink)}.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.status-row:last-child{border-bottom:0;padding-bottom:0}.status-row:first-of-type{padding-top:0}.status{display:inline-flex;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}.compact{display:flex;align-items:center;gap:14px;padding:15px 22px;margin:20px 0}.compact a{margin-left:auto;font-size:12px}.compact span{font-size:12px;color:var(--muted)}.bar{height:9px;display:flex;gap:3px;margin:23px 0;border-radius:6px;overflow:hidden;background:var(--line)}.bar i{background:#0071e3;width:64%}.bar i:nth-child(2){width:25%;background:#71b7ff}.bar i:nth-child(3){width:11%;background:#93a6bb}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px}.toolbar{padding:16px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}input{min-width:0;width:260px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500;background:var(--inner)}td,th{padding:15px 20px;border-bottom:1px solid var(--line)}td{font-size:13px}td strong{font-weight:550;display:block;margin-bottom:3px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--inner)}.table-scroll{overflow:auto}.footer{padding:13px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.tabbar{display:flex;gap:4px;background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;margin:24px 0 18px}.tabbar button{border:0;background:transparent;font-size:13px}.tabbar button.on{background:var(--input);box-shadow:0 2px 4px var(--shade)}.active-config{display:flex;justify-content:space-between;gap:22px;align-items:center}.active-config h2{font-size:19px;margin:9px 0}.details{margin-top:14px;color:var(--muted);font-size:12px}.details summary{cursor:pointer}.details p{margin:12px 0 0}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.row-actions button{font-size:12px;padding:7px 11px}.draft-note{margin-top:16px;color:var(--muted);font-size:12px}.mobile-menu{display:none}.demo-note{font-size:11px;color:var(--muted);text-align:right;margin-top:22px}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--shine);border-radius:24px;padding:28px;width:min(500px,calc(100% - 24px));box-shadow:0 30px 80px #0004}dialog::backdrop{background:#18243155;backdrop-filter:blur(5px)}dialog .row-actions{justify-content:flex-end;margin-top:24px}
@media(max-height:820px) and (min-width:761px){.rail{padding:12px 10px}.rail a{padding-block:5px;min-height:32px}.rail small:not(:first-child){margin-top:10px}}
@media(max-width:1050px){.brand{width:170px}.rail{width:188px}.workspace{margin-left:220px;padding:24px}.columns{grid-template-columns:1fr}.resource-grid{gap:4px}.metric{padding:20px}.rail small:not(:first-child){margin-top:14px}}
@media(max-width:760px){.topbar{top:10px;left:10px;right:10px;height:54px;padding:0 12px;gap:10px}.brand{width:auto;font-size:18px}.crumb{display:none}.mobile-menu{display:block;font-size:12px;padding:6px}.rail{display:none;top:74px;z-index:8;width:218px;background-color:var(--bg)}.rail.open{display:block}.workspace{margin:76px 10px 10px;padding:20px 16px;border-radius:20px;min-height:calc(100svh - 86px)}.page-head{align-items:flex-start;gap:10px;margin-bottom:22px}h1{font-size:27px}.page-head button{font-size:12px;padding:8px 10px}.metrics{grid-template-columns:1fr}.metric{padding:17px 20px}.metric+.metric{border-left:0;border-top:1px solid var(--line)}.value{font-size:30px;margin:5px 0}.resource-grid{grid-template-columns:repeat(3,1fr);gap:20px 8px}.pad{padding:18px}.compact{align-items:flex-start;flex-wrap:wrap;padding:16px;gap:6px 12px}.compact a{margin-left:0}.compact span{flex-basis:100%}.context{font-size:11px;padding:5px 8px}.theme{padding:6px;font-size:11px}.active-config{align-items:flex-start;flex-direction:column}.row-actions{gap:5px}.table-scroll table{min-width:620px}.toolbar{flex-wrap:wrap}.toolbar input{flex:1}.topbar .dot{display:none}}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more){.glass,.workspace,.panel{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border:1px solid var(--muted)}}
</style>
</head>
<body>
<header class="topbar glass"><button class="mobile-menu" aria-label="打开导航">菜单</button><div class="brand">◇ Prism</div><div class="crumb">工作台 / <b id="crumb">总览</b></div><a class="context" href="#versions"><span class="dot"></span><span id="context">已发布配置</span></a><button class="theme" id="theme">深色外观</button></header>
<nav class="rail glass" aria-label="管理栏目" id="rail"></nav>
<main class="workspace" id="main"></main>
<dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-copy" class="muted"></p><div class="row-actions"><button id="close-dialog" class="primary">完成</button></div></dialog>
<script>
// OpenDesign interaction study. Synthetic values; no requests or production credentials.
const groups=[['工作台',[['overview','总览'],['monitoring','请求与失败'],['usage','用量分析'],['billing','计费与价格']]],['资源',[['accounts','账号池'],['upstreams','上游'],['catalog','模型目录'],['models','模型与路由']]],['管理',[['access','访问控制'],['runtime','运行诊断'],['egress','出口策略'],['versions','配置版本'],['audit','审计与备份'],['settings','设置']]]];
// Reuses Prism's existing navigation glyphs.
const icons={"monitoring": "M3 12h4l3-8 4 16 3-8h4", "usage": "M4 20V10 M12 20V4 M20 20v-7"};
document.querySelector('#rail').innerHTML=groups.map(([label,items])=>`<small>${label}</small>${items.map(([id,name])=>`<a href="#${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${icons[id]||icons.overview}"/></svg>${name}</a>`).join('')}`).join('');
const head=(name,sub,action='')=>`<div class="page-head"><div><h1>${name}</h1><p>${sub}</p></div>${action}</div>`;
const sampleNote='<p class="demo-note">OpenDesign · V5 交互样稿 · 数据为设计示例</p>';
const overview=()=>`${head('总览','网关状态与资源，一目了然。','<button onclick="location.hash=\'monitoring\'">查看请求</button>')}<div class="metrics panel"><div class="metric"><div class="label">上游尝试 · 自启动累计</div><div class="value">718</div><div class="note">其中 12 次失败</div></div><div class="metric"><div class="label">尝试成功率</div><div class="value">98.33<span class="label"> %</span></div><div class="note">706 / 718 次上游尝试</div></div><div class="metric"><div class="label">已处理事件 · 自启动累计</div><div class="value">2,217</div><div class="note">包含 676 条用量事件</div></div></div><div class="panel compact"><strong>计费处理中</strong><span>部分历史事件待修复，账本暂不完整。</span><a href="#billing">查看处理状态 →</a></div><div class="panel pad"><div class="section-title"><h2>资源概览</h2><a href="#versions">已发布配置 →</a></div><div class="resource-grid"><a href="#upstreams"><strong>4</strong><span class="label">上游</span></a><a href="#egress"><strong>4</strong><span class="label">出口策略</span></a><a href="#models"><strong>6</strong><span class="label">公开模型</span></a><a href="#access"><strong>2</strong><span class="label">访问组</span></a><a href="#access"><strong>2</strong><span class="label">访问密钥</span></a></div></div><div class="columns"><div class="panel pad"><div class="section-title"><h2>观测与计价</h2><a href="#usage">用量分析 →</a></div><div class="status-row"><span>必需事件</span><span class="status"><i class="dot"></i>未观测到丢失</span></div><div class="status-row"><span>账本记录</span><strong>589</strong></div><div class="status-row"><span>未完成计价</span><a href="#billing">查看处理明细 →</a></div></div><div class="panel pad"><h2>Token 构成</h2><p class="note">自进程启动累计</p><div class="bar"><i></i><i></i><i></i></div><div class="legend"><span>输入 64%</span><span>输出 25%</span><span>缓存 11%</span></div><details class="details"><summary>查看观测口径</summary><p>该图仅展示设计布局。正式前端保留六类 token 及各自置信度，不合并或推断未观测数据。</p></details></div></div>${sampleNote}`;
const accounts=()=>`${head('账号池','管理认证、权益与模型目录。','<button class="primary" onclick="show(\'添加账号\',\'正式应用沿用现有账号接入与凭据校验流程。\')">添加账号</button>')}<div class="metrics panel"><div class="metric"><div class="label">已加载账号</div><div class="value">3</div></div><div class="metric"><div class="label">认证可用</div><div class="value">2</div></div><div class="metric"><div class="label">需要关注</div><div class="value">1</div></div></div><div class="panel"><div class="toolbar"><input aria-label="搜索账号" placeholder="搜索账号或渠道" id="account-search"><span class="note">当前已加载范围</span></div><div class="table-scroll"><table><thead><tr><th>账号</th><th>认证</th><th>调度</th><th>目录</th><th>操作</th></tr></thead><tbody>${[['OpenAI 工作账号','OAuth · Team','可用','就绪','已观测'],['Grok 工作账号','Session · Standard','可用','就绪','未观测'],['备用账号','API Key','待续期','暂停','未观测']].map(r=>`<tr><td><strong>${r[0]}</strong><span class="note">${r[1]}</span></td><td><span class="status">${r[2]==='可用'?'<i class="dot"></i>':''}${r[2]}</span></td><td>${r[3]}</td><td>${r[4]}</td><td><a href="#" onclick="event.preventDefault();show('${r[0]}','右侧详情保留认证、调度、权益、目录证据及失败诊断入口。此处没有提交真实 Provider 请求。')">查看详情 →</a></td></tr>`).join('')}</tbody></table></div><div class="footer">3 个账号 · 权益与认证状态分别展示</div></div>${sampleNote}`;
let history=false,drafting=false;
const versions=()=>`${head('配置版本','在草稿中调整路由，核对后再发布。','<button class="primary" onclick="show(\'创建草稿\',\'正式应用保留版本标识、来源谱系和描述，不把来源字段误当作资源复制。\')">创建草稿</button>')}<div class="panel pad active-config"><div><span class="status"><i class="dot"></i>已发布配置</span><h2>正式网关配置</h2><span class="mono">gateway-production · rev-50</span><details class="details"><summary>配置与应用版本有什么区别？</summary><p>这里只切换查看或编辑的配置。发布、回滚需要单独确认；更换程序版本属于部署。当前网关在重启时加载发布的配置。</p></details></div><button onclick="drafting=false;document.querySelector('#context').textContent='已发布配置';render()">查看已发布配置</button></div><div class="tabbar"><button class="${!history?'on':''}" onclick="history=false;render()">草稿 · 1</button><button class="${history?'on':''}" onclick="history=true;render()">发布历史 · 2</button></div><div class="panel pad"><div class="active-config"><div><h2>${history?'上一份发布配置':'模型路由调整'}</h2><p class="mono muted">${history?'gateway-previous · rev-48':'routing-update · rev-4'}</p><p class="note">${history?'保留发布记录和回滚核对入口。':'尚未发布，对当前服务没有影响。'}</p></div><div class="row-actions"><button onclick="show('配置差异','正式应用保留有界分页、基线选择与陈旧快照保护。')">查看差异</button><button class="primary" onclick="${history?"show('查看历史','历史配置保持只读，回滚仍需单独核对并确认。')":"drafting=true;document.querySelector('#context').textContent='正在编辑草稿';show('已进入草稿','正式应用中可继续前往模型与路由、访问控制等栏目编辑；验证与发布保留在草稿工具栏。')"}">${history?'查看历史':'编辑草稿'}</button></div></div></div>${sampleNote}`;
function show(title,copy){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog').showModal()}
function render(){let id=location.hash.slice(1)||'overview';let item=groups.flatMap(g=>g[1]).find(r=>r[0]===id)||['overview','总览'];document.querySelector('#crumb').textContent=item[1];document.querySelectorAll('.rail a').forEach(a=>a.classList.toggle('on',a.hash==='#'+id));document.querySelector('#main').innerHTML=(id==='overview'?overview():id==='accounts'?accounts():id==='versions'?versions():`${head(item[1],'沿用正式 Prism 的完整功能，统一采用此材质与布局。')}<div class="panel pad"><h2>共享界面规范</h2><p class="muted">本轮设计样稿集中演示总览、账号池和配置版本三种页面结构。其余正式栏目保持原有真实 API、表单、详情和错误处理。</p><div class="row-actions"><button onclick="location.hash='overview'">总览布局</button><button onclick="location.hash='accounts'">资源表格</button><button onclick="location.hash='versions'">配置工作流</button></div></div>${sampleNote}`);document.querySelector('#rail').classList.remove('open');const search=document.querySelector('#account-search');if(search)search.oninput=()=>document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(search.value.toLowerCase()))}
document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'浅色外观':'深色外观'};document.querySelector('.mobile-menu').onclick=()=>document.querySelector('#rail').classList.toggle('open');document.querySelector('#close-dialog').onclick=()=>document.querySelector('#dialog').close();window.onhashchange=render;render();
</script></body></html>
