<!doctype html>
<html lang="zh-CN" data-theme="light" data-lens="off" data-motion="reduce">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Prism · CPA / CPAMP 操作流程 · 第二版</title>
<!-- Reused verbatim: Kimi K3 reviewed V6 style block. Provenance is in the companion README. -->
<style>
/* ============ Prism V6 · 银白/石墨 + Apple 蓝 · Liquid Glass chrome ============ */
:root{
  --canvas:#e8ebf0;
  --surface:#ffffff;
  --surface-2:#f3f5f8;
  --surface-3:#e9edf2;
  --ink:#1b1f26;
  --ink-2:#575f6b;
  --ink-3:#8a929e;
  --separator:rgba(22,32,46,.10);
  --separator-2:rgba(22,32,46,.18);
  --tint:#0066cc;
  --tint-fill:#0071e3;
  --tint-ink:#ffffff;
  --good:#1e7a37;
  --warn:#96660a;
  --serious:#bf3603;
  --critical:#d70015;
  --chart-1:#0066d6;
  --chart-2:#b85f00;
  --chart-3:#0079ab;
  --chart-4:#c41e77;
  /* glass body */
  --glass-blur:12px; --glass-sat:180%; --glass-bright:1.06; --glass-contrast:1.02;
  --glass-tint-top:rgba(255,255,255,.64);
  --glass-tint-mid:rgba(255,255,255,.42);
  --glass-tint-bot:rgba(255,255,255,.52);
  --ring-w:1px;
  --ring-1:rgba(255,255,255,.95); --ring-2:rgba(255,255,255,.42); --ring-3:rgba(255,255,255,.02);
  --ring-4:rgba(255,255,255,.55); --ring-5:rgba(255,255,255,.90);
  --glass-inner:
    inset 0 1px .5px rgba(255,255,255,.9),
    inset 0 -1px .5px rgba(255,255,255,.45),
    inset 0 14px 22px -20px rgba(255,255,255,.95),
    inset 0 -18px 26px -22px rgba(255,255,255,.6);
  --glass-shadow:
    0 1px 1px rgba(14,18,32,.05),
    0 4px 10px -3px rgba(14,18,32,.08),
    0 14px 28px -8px rgba(14,18,32,.12),
    0 30px 60px -22px rgba(14,18,32,.18);
  --glass-shadow-boost:
    0 1px 1px rgba(14,18,32,.07),
    0 5px 12px -3px rgba(14,18,32,.12),
    0 16px 32px -8px rgba(14,18,32,.18),
    0 34px 66px -22px rgba(14,18,32,.26);
  --glass-edge-top:rgba(255,255,255,.28);
  --glass-edge-bot:rgba(255,255,255,.14);
  /* ambient */
  --amb-1:#5f9dff; --amb-2:#b98cff; --amb-3:#3fd7bd; --amb-4:#ffb877;
  --amb-s1:.20; --amb-s2:.13; --amb-s3:.13; --amb-s4:.08;
  --amb-streak:.20; --amb-grain:.16;
  /* material semantics: config version state as glass */
  --mat-draft-blur:22px; --mat-draft-sat:120%; --mat-draft-frost:20; --mat-draft-lsat:1.2;
  --mat-active-blur:11px; --mat-active-sat:195%; --mat-active-frost:9; --mat-active-lsat:1.85;
  /* lens geometry (read by the PrismLens port) */
  --lens-bezel:26; --lens-thickness:34; --lens-ior:1.5; --lens-gain:1; --lens-rim-blur:3;
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:180ms; --dur-anneal:600ms;
  --font-text:-apple-system,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-display:-apple-system,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --canvas:#0e1014;
  --surface:#181b21;
  --surface-2:#20242c;
  --surface-3:#272c35;
  --ink:#f2f4f8;
  --ink-2:#9aa3af;
  --ink-3:#6b7480;
  --separator:rgba(255,255,255,.10);
  --separator-2:rgba(255,255,255,.20);
  --tint:#0a84ff;
  --tint-fill:#0f6fd6;
  --good:#30d158;
  --warn:#ffd60a;
  --serious:#ff9f0a;
  --critical:#ff453a;
  --chart-1:#0a84ff; --chart-2:#cc7a00; --chart-3:#2196c9; --chart-4:#db4e92;
  --glass-blur:13px; --glass-sat:165%; --glass-bright:1.04; --glass-contrast:1.04;
  --glass-tint-top:rgba(13,14,20,.52);
  --glass-tint-mid:rgba(13,14,20,.40);
  --glass-tint-bot:rgba(13,14,20,.48);
  --ring-1:rgba(255,255,255,.62); --ring-2:rgba(255,255,255,.20); --ring-3:rgba(255,255,255,.02);
  --ring-4:rgba(255,255,255,.24); --ring-5:rgba(255,255,255,.50);
  --glass-inner:
    inset 0 1px .5px rgba(255,255,255,.30),
    inset 0 -1px .5px rgba(255,255,255,.16),
    inset 0 16px 26px -24px rgba(255,255,255,.55),
    inset 0 -20px 30px -26px rgba(255,255,255,.35);
  --glass-shadow:
    0 1px 1px rgba(0,0,0,.30),
    0 5px 12px -4px rgba(0,0,0,.40),
    0 18px 36px -10px rgba(0,0,0,.45),
    0 40px 70px -24px rgba(0,0,0,.55);
  --glass-shadow-boost:
    0 1px 1px rgba(0,0,0,.40),
    0 6px 14px -4px rgba(0,0,0,.50),
    0 20px 40px -10px rgba(0,0,0,.55),
    0 44px 78px -24px rgba(0,0,0,.65);
  --glass-edge-top:rgba(255,255,255,.10);
  --glass-edge-bot:rgba(255,255,255,.05);
  --amb-1:#1e5fe0; --amb-2:#7c3aed; --amb-3:#0f9d8f; --amb-4:#c2560a;
  --amb-s1:.20; --amb-s2:.14; --amb-s3:.15; --amb-s4:.08;
  --amb-streak:.16; --amb-grain:.20;
}

/* base */
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 var(--font-text);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}button:disabled{cursor:default;opacity:.5}
a{color:var(--tint);text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--tint) 22%,transparent)}
h1,h2,h3,p{margin:0}
h1{font-family:var(--font-display);font-size:26px;line-height:1.35;font-weight:650}
h2{font-size:15px;font-weight:600;line-height:1.4}
h3{font-size:13px;font-weight:600}
.mono,code{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
code{font-size:12px;overflow-wrap:anywhere}
.muted{color:var(--ink-2)}.small{font-size:12px}.tiny{font-size:11px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
[hidden]{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:18px}
.line{height:1px;background:var(--separator);margin:18px 0}

/* ============ glass chrome（顶栏 / 侧栏 / 草稿坞，最多三面） ============ */
.glass{position:relative;isolation:isolate;border-radius:var(--r-outer,18px);border:0;background-color:transparent;
  background-image:linear-gradient(to bottom,var(--glass-tint-top) 0%,var(--glass-tint-mid) 46%,var(--glass-tint-bot) 100%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright)) contrast(var(--glass-contrast));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright)) contrast(var(--glass-contrast));
  box-shadow:var(--glass-shadow),var(--glass-inner)}
.glass>*{position:relative;z-index:1}
.glass[data-over="content"]{box-shadow:var(--glass-shadow-boost),var(--glass-inner)}
.glass::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:var(--ring-w);pointer-events:none;
  background:linear-gradient(147deg,var(--ring-1) 0%,var(--ring-2) 16%,var(--ring-3) 38%,var(--ring-3) 60%,var(--ring-4) 84%,var(--ring-5) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(to bottom,var(--glass-edge-top) 0%,transparent var(--glass-edge-top-h,18px)),
             linear-gradient(to top,var(--glass-edge-bot) 0%,transparent var(--glass-edge-bot-h,14px))}
@supports (backdrop-filter:url(#prism-lens-topbar)) and (not (-moz-appearance:none)) and (not (background:-webkit-named-image(i))){
  html[data-lens="on"] .glass[data-pane="topbar"]{-webkit-backdrop-filter:url(#prism-lens-topbar);backdrop-filter:url(#prism-lens-topbar)}
  html[data-lens="on"] .glass[data-pane="rail"]{-webkit-backdrop-filter:url(#prism-lens-rail);backdrop-filter:url(#prism-lens-rail)}
  html[data-lens="on"] .glass[data-pane="dock"]{-webkit-backdrop-filter:url(#prism-lens-dock);backdrop-filter:url(#prism-lens-dock)}
  html[data-lens="on"] .glass[data-pane]{background-image:linear-gradient(to bottom,
    color-mix(in srgb,var(--glass-tint-top) 72%,transparent) 0%,
    color-mix(in srgb,var(--glass-tint-mid) 72%,transparent) 46%,
    color-mix(in srgb,var(--glass-tint-bot) 72%,transparent) 100%)}
}
.glass[data-material="draft"]{--glass-blur:var(--mat-draft-blur);--glass-sat:var(--mat-draft-sat);--lens-frost:var(--mat-draft-frost);--lens-sat:var(--mat-draft-lsat)}
.glass[data-material="active"]{--glass-blur:var(--mat-active-blur);--glass-sat:var(--mat-active-sat);--lens-frost:var(--mat-active-frost);--lens-sat:var(--mat-active-lsat)}
.glass[data-material]{transition:backdrop-filter var(--dur-anneal) var(--ease),-webkit-backdrop-filter var(--dur-anneal) var(--ease)}
@supports not (backdrop-filter:blur(1px)){
  .glass,.glass[data-pane]{background:var(--surface);background-image:none;border:1px solid var(--separator)}
  .glass::before,.glass::after{display:none}
}
@media (prefers-reduced-transparency:reduce){
  .glass,html[data-lens="on"] .glass[data-pane]{background-color:color-mix(in srgb,var(--surface) 96%,transparent);background-image:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--glass-shadow)}
  .glass::before{background:var(--separator)}.glass::after{display:none}
}
@media (prefers-contrast:more){
  .glass,html[data-lens="on"] .glass[data-pane]{background:var(--surface);background-image:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid var(--ink-2);box-shadow:none}
  .glass::before,.glass::after{display:none}
}

/* ============ shell ============ */
.shell{position:fixed;inset:0;overflow:hidden;--topbar-h:56px;--rail-w:224px;--canvas-top:88px;--canvas-left:256px;--dock-clear:0px}
.shell[data-draft="true"]{--dock-clear:96px}
.ambient{position:absolute;inset:0;pointer-events:none;background-color:var(--canvas);
  background-image:
    linear-gradient(107deg,transparent 6%,color-mix(in oklab,#ff5f6d calc(var(--amb-streak)*22%),transparent) 12%,color-mix(in oklab,#ffc371 calc(var(--amb-streak)*24%),transparent) 17%,color-mix(in oklab,#6ee7b7 calc(var(--amb-streak)*30%),transparent) 22%,color-mix(in oklab,#60a5fa calc(var(--amb-streak)*30%),transparent) 27%,color-mix(in oklab,#a78bfa calc(var(--amb-streak)*26%),transparent) 32%,transparent 46%),
    radial-gradient(ellipse 64% 52% at 4% -6%,color-mix(in oklab,var(--amb-1) calc(var(--amb-s1)*100%),transparent),transparent),
    radial-gradient(ellipse 56% 50% at 98% 2%,color-mix(in oklab,var(--amb-2) calc(var(--amb-s2)*100%),transparent),transparent),
    radial-gradient(ellipse 70% 62% at 36% 108%,color-mix(in oklab,var(--amb-3) calc(var(--amb-s3)*100%),transparent),transparent),
    radial-gradient(ellipse 34% 40% at 90% 62%,color-mix(in oklab,var(--amb-4) calc(var(--amb-s4)*100%),transparent),transparent)}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:var(--amb-grain);mix-blend-mode:overlay}
html[data-theme="dark"] .grain{mix-blend-mode:soft-light}
.lens-defs{position:absolute;width:0;height:0;pointer-events:none}

.topbar{--r-outer:16px;position:absolute!important;inset:14px 14px auto;height:var(--topbar-h);display:flex;align-items:center;padding:0 14px;gap:12px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-width:196px;color:var(--ink)}
.brandmark{width:26px;height:26px;display:block;flex-shrink:0}
.brand-name{font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand-tag{font-size:12px;color:var(--ink-2);border-left:1px solid var(--separator-2);padding-left:10px;margin-left:2px}
.top-divider{width:1px;height:20px;background:var(--separator-2)}
.crumb{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.crumb b{color:var(--ink);font-weight:550}
.vctx{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--separator-2);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--surface) 42%,transparent);white-space:nowrap}
.vctx:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.vctx i{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.vctx[data-state="draft"] i{background:var(--warn)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:600;border:0;flex-shrink:0}

.rail{--r-outer:18px;position:absolute!important;left:14px;top:var(--canvas-top);bottom:14px;width:var(--rail-w);z-index:30;display:flex;flex-direction:column;padding:12px 10px 10px}
.nav-scroll{min-height:0;flex:1;overflow:auto;scrollbar-width:none}
.nav-group+.nav-group{margin-top:14px}
.nav-label{color:var(--ink-2);font-size:12px;font-weight:500;padding:0 12px 6px}
.nav-link{display:flex;align-items:center;min-height:36px;gap:10px;border-radius:10px;padding:7px 11px;color:var(--ink);font-size:13px;line-height:1.4;position:relative}
.nav-link svg{width:16px;height:16px;color:var(--ink-2);flex-shrink:0}
.nav-link:hover{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.nav-link[aria-current="page"]{background:color-mix(in srgb,var(--tint) 12%,var(--surface));font-weight:600;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent),inset 0 1px color-mix(in srgb,var(--surface) 70%,transparent)}
.nav-link[aria-current="page"] svg{color:var(--tint)}
.nav-count{margin-left:auto;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rail-bottom{margin:10px 4px 0;border-top:1px solid var(--separator);padding:10px 8px 0}
.rail-note{display:flex;gap:9px;align-items:center;color:var(--ink-2);font-size:12px}
.rail-note b{display:block;color:var(--ink);font-weight:550;font-size:12px}

.canvas{position:absolute;inset:0;overflow:auto;scrollbar-gutter:stable;z-index:1;
  padding:var(--canvas-top) 24px calc(32px + var(--dock-clear)) var(--canvas-left);
  scroll-padding:var(--canvas-top) 24px 32px var(--canvas-left);
  mask-image:linear-gradient(to bottom,transparent 0,transparent 14px,#000a 52px,#000 var(--canvas-top))}
.shell[data-draft="true"] .canvas{mask-image:linear-gradient(to bottom,transparent 0,transparent 14px,#000a 52px,#000 var(--canvas-top)),linear-gradient(to top,transparent 12px,#000a 48px,#000 88px);mask-composite:intersect}
.sheet{position:relative;background:var(--surface);border:1px solid var(--separator);border-radius:20px;padding:32px 34px 26px;min-height:calc(100vh - 124px);max-width:1440px;margin:0 auto;
  box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 3%,transparent),0 16px 40px -28px color-mix(in srgb,var(--ink) 26%,transparent)}

.dock{--r-outer:99px;position:absolute!important;z-index:60;bottom:20px;left:calc(50% + 112px);transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;min-height:58px;max-width:calc(100vw - 32px);white-space:nowrap}
.dock strong{font-size:13px;font-weight:600}
.dock small{font-size:12px;color:var(--ink-2)}

/* ============ page composition（编辑式分节，不用等高卡片阵） ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:6px}
.page-head h1{margin-bottom:8px}
.subtitle{color:var(--ink-2);font-size:13px;line-height:1.7;max-width:640px}
.scope-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin:10px 0 4px;flex-wrap:wrap}
.scope-row i{width:5px;height:5px;border-radius:50%;background:var(--tint);flex-shrink:0}
.band{padding:26px 0 28px;border-top:1px solid var(--separator)}
.band:first-of-type{border-top:0;padding-top:18px}
.band-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.band-head h2{margin:0}
.band-head .small{color:var(--ink-2)}
.readouts{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.2fr;border-top:1px solid var(--separator);border-bottom:1px solid var(--separator);padding:22px 0 24px;margin:14px 0 0}
.ro{padding:0 22px;border-left:1px solid var(--separator);min-width:0}
.ro:first-child{border-left:0;padding-left:0}
.ro-label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ro-value{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:27px;font-weight:650;letter-spacing:-.01em;line-height:1.25;margin:8px 0 4px}
.ro-hero .ro-value{font-size:42px}
.ro-value small{font-size:14px;font-weight:450;letter-spacing:0;color:var(--ink-2);margin-left:4px}
.ro-note{font-size:12px;color:var(--ink-2);line-height:1.6}
.ro-note a{font-weight:500}
.q-row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--separator);color:var(--ink)}
.q-row:first-of-type{border-top:0;padding-top:4px}
.q-dot{width:8px;height:8px;border-radius:50%;justify-self:center}
.q-dot.warn{background:var(--warn)}.q-dot.serious{background:var(--serious)}.q-dot.critical{background:var(--critical)}.q-dot.good{background:var(--good)}
.q-row b{font-size:13px;font-weight:550;display:block}
.q-row small{display:block;color:var(--ink-2);font-size:12px;margin-top:3px;line-height:1.6}
a.q-row:hover b{color:var(--tint)}
.q-row .chev{color:var(--ink-3)}
.i-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--separator);color:var(--ink);font-size:13px}
.i-row:first-of-type{border-top:0;padding-top:2px}
.i-row:hover .i-name{color:var(--tint)}
.i-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.i-count{font-variant-numeric:tabular-nums;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-size:12px}
.page-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--separator);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ============ data components ============ */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--separator-2);border-radius:10px;padding:8px 12px;background:var(--surface);min-width:210px;max-width:300px}
.searchbox svg{color:var(--ink-2);width:15px;height:15px;flex-shrink:0}
.searchbox input{border:0;outline:none;background:transparent;width:100%;min-width:0;font-size:13px}
.searchbox:focus-within{outline:2px solid var(--tint);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.segment{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px;max-width:100%;overflow:auto;border:1px solid var(--separator)}
.segment button{border:0;border-radius:8px;padding:6px 12px;background:transparent;white-space:nowrap;font-size:12px;color:var(--ink-2);min-height:30px;display:flex;align-items:center;gap:6px}
.segment button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 12%,transparent);font-weight:550}
.filter-select{border:1px solid var(--separator-2);padding:7px 26px 7px 11px;border-radius:10px;background:var(--surface);font-size:12px;min-height:34px}
.tbl-wrap{overflow:auto;max-width:100%;scrollbar-width:thin}
table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}

// Pure prototype state. The page renders it; no services, timers or persistence.
const AccountFlow = (()=>{
  const permissionMode='separate';
  const channels=[
    {id:'kimi-api',name:'Kimi API',kind:'api',url:'https://api.moonshot.cn/v1'},
    {id:'openai-compatible',name:'OpenAI 兼容',kind:'api',url:''},
    {id:'anthropic-compatible',name:'Anthropic 兼容',kind:'api',url:''},
    {id:'grok.official',name:'Grok Official',kind:'api',url:'https://api.x.ai/v1'},
    {id:'codex',name:'Codex',kind:'oauth'}, {id:'claude',name:'Claude',kind:'oauth'},
    {id:'kimi-coding',name:'Kimi Coding',kind:'device'}, {id:'grok.build',name:'Grok Build',kind:'device'},
    {id:'kiro',name:'Kiro',kind:'device'}, {id:'grok.console',name:'Grok Console',kind:'import'}, {id:'grok.web',name:'Grok Web',kind:'import'}
  ];
  const channel=id=>channels.find(x=>x.id===id);
  const account=(id,c,name,extra={})=>({id,channel:c,name,identity:'demo-'+c+'-primary',auth:'active',disabled:false,activeDisabled:false,applied:true,scope:'work',connection:'日常接入',catalog:'fresh',quota:'not_provided',lastQuota:'not_provided',quotaExhausted:false,inFlight:0,revision:1,test:null,removed:false,isolation:false,...extra});
  function initial(scene='normal'){
    const s={view:'accounts',filter:'all',query:'',sheet:null,form:null,selected:null,tab:'overview',toast:null,scene,accounts:[account('codex-main','codex','Codex · 日常'),account('kimi-work','kimi-coding','Kimi Coding · 编程',{auth:'expired'}),account('claude-main','claude','Claude · 工作',{catalog:'stale'}),account('build-backup','grok.build','Grok Build · 备用',{disabled:true,activeDisabled:true}),account('api-main','openai-compatible','兼容 API · 演示',{url:'https://gateway.example.invalid/v1'})],pending:[],draftRevision:1,reviewRevision:null,authSession:null,importRows:[],historyCount:148,globalBlocked:false,nextId:1,nextApplyFail:false,multipleConnections:false,labOpen:false,events:[]};
    if(scene==='empty'){s.accounts=[];s.view='providers';}
    if(scene==='drafts'){s.pending=[{type:'other',label:'已有修改：备用连接权重 1 → 2'},{type:'other',label:'已有修改：自动化 Key 备注'}];s.multipleConnections=true;s.view='providers';}
    if(scene==='lifecycle')s.accounts[0].inFlight=2;
    if(scene==='native'){s.accounts[3].disabled=false;s.accounts[3].activeDisabled=false;s.accounts[3].applied=false;s.accounts[3].applyFailed=true;s.pending=[{id:'build-backup',type:'update',label:'Grok Build · 备用：等待恢复应用'}];s.globalBlocked=true;}
    return s;
  }
  const copy=x=>JSON.parse(JSON.stringify(x));
  function transition(prev,action,value={}){
    const s=copy(prev),find=id=>s.accounts.find(x=>x.id===id),target=()=>find(value.id||s.selected),say=(message,tone='')=>{s.toast={message,tone};s.events.push(message);return s;};
    const close=()=>{s.sheet=null;s.form=null;s.scopeChoice=null;};
    const inherited=c=>s.accounts.find(x=>x.channel===c&&!x.removed)?.scope;
    const newScope=form=>inherited(form.channel)||form.scope||'none';
    const apply=()=>{
      if(s.nextApplyFail){s.nextApplyFail=false;for(const p of s.pending){const a=find(p.id);if(a){a.applyFailed=true;if(['grok.build','grok.console','grok.web'].includes(a.channel))s.globalBlocked=true;}}return false;}

      const success=apply();if(!keepSheet)close();return say(success?'已保存并自动生效。真实调用尚未验证。':'已保存，应用失败。请从待应用修改中恢复。',''+(success?'':'bad'));
    };
    const makeForm=(c,id)=>{const a=find(id);return {id:a?.id||null,channel:c,name:a?.name||channel(c).name+' · 演示',url:a?.url??channel(c).url??'',scope:'',connection:a?.connection||(s.multipleConnections?'':'官方默认接入'),keys:1,modelsRead:false,tested:false,error:null};};
    const authFinish=()=>{
      const session=s.authSession;if(!session||!['waiting','unknown'].includes(session.status))return say('当前没有待完成的授权。','warn');
      if(session.identity==='different'&&session.id){session.status='conflict';return say('返回身份与目标账号不同，未覆盖原账号。','bad');}
      if(session.identity==='unknown'){session.status='identity';return say('身份依据不足，保留原账号，等待重新查询。','warn');}
      const identity=session.identity==='different'?'demo-'+session.channel+'-other':session.identityKey;
      let a=find(session.id)||s.accounts.find(x=>!x.removed&&x.channel===session.channel&&x.identity===identity);if(!a){a=account('added-'+s.nextId++,session.channel,channel(session.channel).name+' · 新账号',{scope:session.scope,connection:session.connection,identity});s.accounts.unshift(a);}
      else {a.auth='active';a.revision++;a.test=null;}
      session.id=a.id;session.status='success';s.selected=a.id;const result=queue([{id:a.id,type:'update',label:a.name+'：授权已保存'}]);
      if(s.sheet!=='review')s.sheet=null;
      return result;
    };
    switch(action){
      case 'view':s.view=value.view;s.query='';s.filter='all';return s;
      case 'filter':s.filter=value.value;return s;
      case 'query':s.query=value.value;return s;
      case 'dismiss':s.toast=null;return s;
      case 'field':if(s.form)s.form[value.name]=value.value;return s;
      case 'newApi':s.form=makeForm('kimi-api');s.sheet='api';return s;
      case 'editApi':{const a=target();if(!a)return s;s.form=makeForm(a.channel,a.id);s.sheet='api';return s;}
      case 'apiChannel':s.form=makeForm(value.channel);return s;
      case 'addKey':if(s.form)s.form.keys++;return s;
      case 'discoverForm':if(s.form){s.form.modelsRead=true;s.form.error=null;}return say('模型读取完成（模拟）。保存不以目录读取或测试通过为前提。');
      case 'testForm':if(s.form){s.form.tested=true;s.form.error=null;}return say('所选演示模型的测试结果已模拟；没有发送真实推理。');
      case 'saveApi':{
        const f=s.form;if(!f||s.sheet!=='api')return s;
        if(!f.name.trim()||!/^https?:\/\//.test(f.url)){f.error='请填写名称和有效的 Base URL。';return s;}
        if(!f.connection){f.error='有多个匹配的接入配置，请在当前表单选择。';return s;}
        let a=find(f.id);if(a){a.name=f.name;a.url=f.url;a.auth='active';a.revision++;}
        else {a=account('added-'+s.nextId++,f.channel,f.name,{url:f.url,scope:newScope(f),connection:f.connection});s.accounts.unshift(a);}
        s.selected=a.id;return queue([{id:a.id,type:'update',label:a.name+'：保存 API 配置'}]);
      }
      case 'login':{
        const a=value.id?find(value.id):null,c=value.channel||a?.channel;s.form=makeForm(c,value.id);s.sheet='auth';
        s.authSession={channel:c,id:value.id||null,identityKey:a?.identity||'demo-'+c+'-primary',status:'setup',identity:'same',origin:s.view,scope:a?.scope||inherited(c)||'none',connection:a?.connection||s.form.connection};
        if(s.form.connection)s.authSession.status='waiting';return s;
      }
      case 'beginAuth':{
        if(!s.form||!s.authSession)return s;
        if(!s.form.connection){s.form.error='请选择要复用的接入配置。';return s;}
        s.authSession.scope=newScope(s.form);s.authSession.connection=s.form.connection;s.authSession.status='waiting';s.form.error=null;return s;
      }
      case 'authIdentity':if(s.authSession)s.authSession.identity=value.value;return s;
      case 'authComplete':return authFinish();
      case 'authDenied':if(s.authSession)s.authSession.status='denied';return say('本次授权被拒绝；没有保存新授权，已有账号和设置保留。','warn');
      case 'authLost':if(s.authSession)s.authSession.status='unknown';return say('授权响应未确认。先查询结果，不重复授权。','warn');
      case 'checkAuth':if(s.authSession?.status==='identity'){if(s.authSession.identity==='same')s.authSession.status='unknown';else return say('仍缺少可靠的同一账号身份依据。','warn');}return authFinish();
      case 'retryAuth':if(s.authSession){s.authSession.status='waiting';s.authSession.identity='same';}return s;
      case 'resumeAuth':if(s.authSession)s.sheet='auth';return s;
      case 'viewAccounts':s.view='accounts';close();return s;
      case 'close':
        if(s.sheet==='auth'&&s.authSession?.status==='waiting'){s.authSession.status='unknown';close();return say('已停止等待；授权结果待确认，可从提示继续核对。','warn');}
        close();return s;
      case 'import':s.sheet='import';if(!s.importRows.some(r=>r.status!=='saved'))s.importRows=[];s.form={channel:'codex',scope:''};return s;
      case 'importSample':
        s.importRows=[{name:'codex-main.demo.json',channel:'codex',match:'codex-main',status:'ready'},{name:'kimi-coding.demo.json',channel:'kimi-coding',status:'ready'},{name:'invalid.demo.json',channel:'codex',status:'invalid'}];return s;
      case 'submitImport':{
        if(!s.importRows.length)return say('请先选择示例文件或载入示例 JSON。','warn');
        const items=[];for(const r of s.importRows){if(r.status==='saved')continue;if(r.status==='invalid'){r.error='JSON 格式不完整，未保存。';continue;}
          let a=find(r.match)||s.accounts.find(x=>!x.removed&&x.channel===r.channel&&x.identity==='demo-file-'+r.name);if(a){a.auth='active';a.revision++;a.test=null;}else{a=account('added-'+s.nextId++,r.channel,channel(r.channel).name+' · 导入示例',{scope:inherited(r.channel)||'none',identity:'demo-file-'+r.name});s.accounts.unshift(a);r.match=a.id;}r.status='saved';items.push({id:a.id,type:'update',label:a.name+'：导入授权'});
        }
        if(items.length)queue(items,true);
        const failed=s.importRows.filter(r=>r.status!=='saved').length;
        if(s.sheet!=='review')s.sheet='import';
        return say('已保存 '+s.importRows.filter(r=>r.status==='saved').length+' 项，'+failed+' 项待处理。'+(s.pending.length?'保存结果已保留，配置仍待应用。':'成功项已回到账号列表并生效。'),failed?'warn':'');
      }
      case 'fixImport':s.importRows=s.importRows.map(r=>r.status==='invalid'?{...r,status:'ready',error:null}:r);return s;
      case 'detail':s.selected=value.id;s.scopeChoice=null;s.tab=value.tab||'overview';s.sheet='detail';return s;
      case 'tab':s.tab=value.tab;return s;
      case 'modelScope':s.scopeChoice=value.value;return s;
      case 'saveScope':{const a=target();if(!a)return s;const choice=s.scopeChoice??a.scope;if(!choice)return say('请选择开放范围。','warn');if(choice===a.scope){close();return say('模型权限保持不变。');}a.scope=choice;s.scopeChoice=null;return queue([{id:a.id,type:'update',label:a.name+'：更新演示模型的开放范围'}]);}
      case 'refreshModels':{const a=target();if(!a)return s;if(a.auth!=='active')return say('授权已失效，请先重新授权。旧目录仍保留。','warn');a.catalog='fresh';return say('模型目录已更新（模拟）；已有权限不变，未测试调用。');}
      case 'refreshQuota':{const a=target();if(!a)return s;a.quota='not_provided';a.lastQuota='not_provided';return say('上游未提供额度（模拟），不记为零余额；未到期的耗尽限制仍保留。');}
      case 'toggle':{const a=target();if(!a||a.auth==='unknown')return say('请先核对账号状态。','warn');a.disabled=!a.disabled;const res=queue([{id:a.id,type:'update',label:a.name+'：'+(a.disabled?'停用':'启用')}]);if(a.applied)return say(a.disabled?'已停用；不再分配新请求，在途请求自然结束。':'已启用；仍须满足授权、额度及模型权限。');return res;}
      case 'delete':s.selected=value.id;s.sheet='delete';return s;
      case 'confirmDelete':{const a=target();if(!a||s.sheet!=='delete')return s;a.deletionPending=true;const res=queue([{id:a.id,type:'delete',label:a.name+'：移除账号及其关联'}]);return a.removed?say('账号已移除，共享接入配置、在途请求和历史记录保留。'):res;}
      case 'review':s.sheet='review';s.reviewRevision=s.draftRevision;return s;
      case 'keepPending':close();return say('保留待应用；已保存结果仍在，运行配置没有被此操作更新。');
      case 'concurrentEdit':s.pending.push({type:'other',label:'核对期间新增：连接超时设置'});s.draftRevision++;return say('清单已变化，请重新读取后确认。','warn');
      case 'reviewLatest':s.reviewRevision=s.draftRevision;return s;
      case 'apply':if(s.reviewRevision!==s.draftRevision)return say('清单已变化，不能使用旧核对结果。','warn');if(!apply())return say('保存结果保留，运行应用仍失败。','bad');close();return say('清单内修改已一起生效；没有发送推理测试。');
      case 'test':{const a=target();if(!a)return s;s.selected=a.id;if(a.disabled||!a.applied||a.auth!=='active'||a.scope==='none'||a.quotaExhausted||a.isolation)return say('当前账号不满足调用条件，请先处理其状态或模型权限。','warn');s.sheet='test';s.form={protocol:'Chat Completions'};return s;}
      case 'runTest':{const a=target();if(!a||s.sheet!=='test')return s;a.test=s.form.protocol;close();return say('仅模拟了演示模型 / '+a.test+' 的测试结果。真实调用仍未验证。');}
      case 'recovery':{const a=target();if(!a||a.disabled||a.auth!=='active'||!a.applied||a.quotaExhausted||!a.isolation)return say('当前没有可解除的隔离，或存在停用、失效授权、配置/额度限制。','warn');s.selected=a.id;s.sheet='recovery';return s;}
      case 'confirmRecovery':{const a=target();if(!a||s.sheet!=='recovery'||a.disabled||a.auth!=='active'||!a.applied||a.quotaExhausted)return say('恢复条件已变化，未解除限制。','warn');a.isolation=false;close();return say('允许再次尝试，尚未验证。没有更新上游授权、余额或执行探测。');}
      case 'scenario':return initial(value.scene);
      case 'lab':{
        const a=target()||s.accounts.find(x=>!x.removed);if(value.kind==='applyFailure'){s.nextApplyFail=true;return say('下一次应用将返回演示失败。');}if(!a)return s;
        if(value.kind==='expired')a.auth='expired';if(value.kind==='quotaFailure')a.quota='failed';if(value.kind==='stale')a.catalog='stale';if(value.kind==='isolated')a.isolation=true;
        if(value.kind==='exhausted'){a.quotaExhausted=true;a.quota='exhausted';a.lastQuota='exhausted';}
        if(value.kind==='finish'&&a.inFlight){a.inFlight--;s.historyCount++;}
        return say('已为“'+a.name+'”载入演示状态；不是线上观察。');
      }
      default:return s;
    }
  }
  function status(a){
    if(a.deletionPending&&!a.removed)return ['移除待生效','已保存移除意图，运行状态尚未采用','warn'];
    if(a.disabled)return [a.activeDisabled?'已停用':'停用待生效','保留授权与设置，不自动启用',''];
    if(a.auth==='expired')return ['需要重新授权','授权已失效，请更新原账号授权','bad'];
    if(a.applyFailed)return ['应用失败','账号已保存，配置尚未被采用','bad'];
    if(!a.applied)return ['已保存，待生效','查看待应用修改','warn'];
    if(a.quotaExhausted)return ['额度已耗尽','观察范围：此演示账号；重置时间未到','warn'];
    if(a.isolation)return ['暂时隔离','本地停止分配，授权仍保留','warn'];
    if(a.scope==='none')return ['模型未开放','接入已生效，可从模型设置开放范围','warn'];
    return ['已配置，调用未验证',a.catalog==='stale'?'模型目录陈旧，可按需更新':'没有已知阻断，尚无真实调用证据',''];
  }
  return {initial,transition,status,channels,channel,permissionMode};
})();
</script>
<script>
let state=AccountFlow.initial();
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,params={},kind='')=>'<button type="button" class="btn '+kind+'" data-action="'+action+'" data-params="'+esc(JSON.stringify(params))+'">'+esc(label)+'</button>';
const scopeLabel=x=>({work:'日常编程 Key',all:'现有全部 Key',none:'暂不开放'}[x]||'请选择开放范围');
const scopeOptions=value=>[['','请选择开放范围'],['work','日常编程 Key'],['all','现有全部 Key'],['none','暂不开放']].map(([v,t])=>'<option value="'+v+'"'+(v===value?' selected':'')+'>'+t+'</option>').join('');
const options=(items,current)=>items.map(([v,t])=>'<option value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(t)+'</option>').join('');
const note=(text,tone='')=>'<div class="flow-note '+tone+'">'+text+'</div>';
const defs=items=>'<dl class="flow-definition">'+items.map(([a,b])=>'<div><dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd></div>').join('')+'</dl>';
const current=()=>state.accounts.find(a=>a.id===state.selected);
const quota=a=>a.quota==='failed'?'读取失败 · 上次'+(a.lastQuota==='exhausted'?'已耗尽':'未提供额度'):a.quotaExhausted?'额度耗尽 · 未到重置时间':'上游未提供额度';
function modelPolicy(form){
  const original=state.accounts.find(a=>a.id===form.id),existing=state.accounts.find(a=>a.channel===form.channel&&!a.removed);
  if(original||existing)return '<p class="flow-help">已有模型沿用原权限：'+esc(scopeLabel((original||existing).scope))+'。本次接入不扩大权限。</p>';
  return '<p class="flow-help">新模型暂不开放。接入后可通过账号的“模型”设置客户端权限。</p>';
}
function connectionField(form){return state.multipleConnections&&!form.id?'<label class="flow-field"><span>已有接入配置</span><select id="form-connection" data-field="connection">'+options([['','请选择匹配的配置'],['直连 · 日常','直连 · 日常 / 官方地址 / 无代理'],['代理 · 备用','代理 · 备用 / 官方地址 / 已有代理组']],form.connection)+'</select><div class="flow-help">找到多个符合条件的配置，在这里选一个即可。</div></label>':'';}
function title(name,subtitle,actions){return '<div class="page-head"><div><h1>'+name+'</h1><p class="subtitle">'+subtitle+'</p></div><div class="flow-actions">'+actions+'</div></div>';}
function rowActions(a){
  const c=AccountFlow.channel(a.channel),id={id:a.id};
  const recovery=a.auth==='expired'?button(c.kind==='api'?'更换密钥':'重新授权',c.kind==='api'?'editApi':'login',{id:a.id,channel:a.channel},'quiet compact'):a.applyFailed||!a.applied?button('查看修改','review',{},'quiet compact'):'';
  return '<div class="flow-actions">'+recovery+button('模型','detail',{...id,tab:'models'},'compact')+button('详情','detail',id,'compact')+'<button type="button" class="flow-switch" role="switch" aria-label="'+esc(a.name)+' 启用状态" aria-checked="'+!a.disabled+'" data-action="toggle" data-params="'+esc(JSON.stringify(id))+'"></button><details class="row-more"><summary>更多</summary><div class="row-menu">'+(c.kind==='api'?button('编辑配置','editApi',id):button('重新授权','login',{...id,channel:a.channel}))+(c.kind!=='api'?button('更新额度','refreshQuota',id):'')+button('测试调用','test',id)+button('删除账号','delete',id,'danger')+'</div></details></div>';
}
function accountsTable(providerOnly=false){
  const all=state.accounts.filter(a=>!a.removed&&(!providerOnly||AccountFlow.channel(a.channel).kind==='api'));
  const filtered=all.filter(a=>(state.filter==='all'||state.filter==='disabled'&&a.disabled||state.filter==='problem'&&!a.disabled&&(a.auth!=='active'||!a.applied||a.quotaExhausted||a.isolation)||state.filter===a.channel)&&(a.name+' '+AccountFlow.channel(a.channel).name).toLowerCase().includes(state.query.toLowerCase()));
  const toolbar='<div class="flow-bar"><div class="left"><input class="flow-search" id="account-search" data-query placeholder="搜索账号或渠道" value="'+esc(state.query)+'" aria-label="搜索账号或渠道"><select id="account-filter" data-filter aria-label="筛选账号">'+options([['all','全部状态与渠道'],['problem','需要处理'],['disabled','已停用'],...AccountFlow.channels.filter(c=>!providerOnly||c.kind==='api').map(c=>[c.id,c.name])],state.filter)+'</select></div><span class="flow-secondary">'+filtered.length+' 个'+(providerOnly?'配置':'账号')+' · 合成数据</span></div>';
  if(!all.length)return toolbar+'<div class="flow-empty"><h2>'+(providerOnly?'添加第一个 API 配置':'还没有账号')+'</h2><p>'+(providerOnly?'填写渠道、地址和 Key 即可保存。系统自动组织连接。':'授权登录或导入认证文件，完成后账号会显示在这里。')+'</p>'+button(providerOnly?'添加 API 配置':'导入认证文件',providerOnly?'newApi':'import',{},'primary')+'</div>';
  return toolbar+'<div class="flow-table-wrap"><table class="flow-table"><thead><tr><th>'+(providerOnly?'API 配置':'账号')+'</th><th>渠道</th><th>状态</th><th>'+(providerOnly?'地址':'额度')+'</th><th>启停与操作</th></tr></thead><tbody>'+filtered.map(a=>{const st=AccountFlow.status(a);return '<tr data-account="'+a.id+'"><td><button class="account-name" data-action="'+(providerOnly?'editApi':'detail')+'" data-params="'+esc(JSON.stringify({id:a.id}))+'">'+esc(a.name)+'</button><div class="flow-secondary">'+esc(a.connection)+(a.inFlight?' · '+a.inFlight+' 条在途':'')+'</div></td><td>'+esc(AccountFlow.channel(a.channel).name)+'<div class="flow-secondary">'+(AccountFlow.channel(a.channel).kind==='api'?'API Key':'授权账号')+'</div></td><td><div class="flow-status '+st[2]+'">'+esc(st[0])+'</div><div class="flow-secondary">'+esc(st[1])+'</div></td><td>'+esc(providerOnly?a.url||'官方地址':quota(a))+'<div class="flow-secondary">'+(providerOnly?'密钥仅展示保存状态':'演示观察 · 09:40')+'</div></td><td>'+rowActions(a)+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function renderPage(){
  let html='';
  if(state.view==='providers')html=title('API 配置','在同一张表单管理地址、密钥和模型。',button('添加 API 配置','newApi',{},'primary'))+accountsTable(true);
  else if(state.view==='oauth')html=title('授权登录','选择渠道完成登录，授权账号会自动登记。','<span class="proto-tag">仅模拟授权，不访问真实账号</span>')+'<div class="login-grid">'+AccountFlow.channels.filter(c=>['oauth','device'].includes(c.kind)).map(c=>{const done=state.authSession?.channel===c.id&&state.authSession.status==='success';return '<article class="login-card-flow"><div class="brand-symbol">'+c.name[0]+'</div><h2>'+c.name+'</h2><p>'+(['device'].includes(c.kind)?'使用设备授权登录。':'使用官方 OAuth 登录。')+'<br>完成后无需再次保存账号。</p><div class="flow-actions">'+button(done?'登录另一个账号':'登录','login',{channel:c.id},done?'':'primary')+(done?button('查看账号','viewAccounts',{},'quiet'):'')+'</div>'+(done?'<p class="flow-help" style="margin:14px 0 0;min-height:0">授权已保存 · '+(state.pending.length?'配置待应用':'配置已生效')+'</p>':'')+'</article>';}).join('')+'</div>';
  else html=title('账号管理','从账号出发，查看状态并处理需要关注的问题。',button('授权登录','view',{view:'oauth'})+button('导入认证文件','import',{},'primary'))+accountsTable();
  const authUnknown=state.authSession&&['unknown','identity','conflict'].includes(state.authSession.status);
  const banner=state.globalBlocked?'<div class="flow-alert flow-note bad"><span><strong>网关暂不接收新请求（模拟）</strong><br>账号已保存，但运行应用失败。</span>'+button('恢复应用','review')+'</div>':authUnknown?'<div class="flow-alert flow-note warn"><span>上次授权结果需要核对。原账号和设置保留。</span>'+button('继续核对','resumeAuth')+'</div>':'';
  const toast=state.toast?'<div class="flow-toast '+state.toast.tone+'" role="status"><span>'+esc(state.toast.message)+'</span>'+button('关闭提示','dismiss',{},'compact')+'</div>':'';
  $('workspace').innerHTML=banner+toast+html;
}
function renderSheet(){
  const s=state,f=s.form,a=current();let heading='',body='',foot=button('关闭','close');
  if(s.sheet==='api'){
    heading=f.id?'编辑 API 配置':'添加 API 配置';
    body=(f.error?note(esc(f.error),'bad'):'')+'<div class="flow-grid"><label class="flow-field"><span>渠道</span><select id="form-channel" data-api-channel'+(f.id?' disabled':'')+'>'+options(AccountFlow.channels.filter(c=>c.kind==='api').map(c=>[c.id,c.name]),f.channel)+'</select></label><label class="flow-field"><span>名称</span><input id="form-name" data-field="name" value="'+esc(f.name)+'"></label><label class="flow-field wide"><span>Base URL</span><input id="form-url" data-field="url" value="'+esc(f.url)+'" placeholder="https://api.example.com/v1"></label></div><label class="flow-field"><span>API Key</span><input readonly value="DEMO_KEY_ONLY · 演示凭据"><div class="flow-help">本原型不收集真实密钥。'+(f.id?'替换凭据保留原账号的停用状态与权限。':'')+'</div></label>'+connectionField(f)+modelPolicy(f)+'<details><summary>模型与高级设置</summary><div class="flow-actions" style="margin-top:14px">'+button('读取模型（模拟）','discoverForm')+button('测试演示模型','testForm')+'</div><p class="flow-help">'+(f.modelsRead?'演示模型 A · 目录读取完成。':'模型读取与调用测试按需进行，不是保存的前置条件。')+(f.tested?' 已模拟测试；真实调用未验证。':'')+'</p>'+defs([['代理 / 地区','沿用默认值或已匹配的接入配置'],['密钥条目',f.keys+' 份演示凭据']])+button('增加演示 Key','addKey',{},'compact')+'</details>';
    foot=button('取消','close')+button('保存','saveApi',{},'primary');
  }else if(s.sheet==='auth'){
    const session=s.authSession,c=AccountFlow.channel(session.channel),device=c.kind==='device';heading=(session.id?'重新授权 · ':'登录 · ')+c.name;
    if(session.status==='setup'){
      body=note('授权完成后直接登记到账号列表。')+(f.error?note(esc(f.error),'bad'):'')+connectionField(f)+modelPolicy(f);foot=button('取消','close')+button('开始登录','beginAuth',{},'primary');
    }else{
      const problem=['unknown','identity','conflict','denied'].includes(session.status);
      body=note(session.status==='waiting'?'请在授权页面完成登录。完成后系统会自动登记账号。':session.status==='denied'?'授权被拒绝，没有保存新的授权。':session.status==='conflict'?'返回的是另一个账号，原授权未被覆盖。':session.status==='identity'?'暂时缺少可靠身份依据，原账号保持不变。':'最后一次响应丢失，先查询已发生的结果。',problem?'warn':'')+(device?'<label class="flow-field"><span>设备码（演示）</span><input readonly value="DEMO-8231"></label>':'')+'<label class="flow-field"><span>授权链接（演示）</span><input readonly value="https://authorize.example.invalid/demo"></label><p class="flow-help">本页面没有打开真实授权站点。下方模拟器只替代外部授权返回。</p>'+(session.id?note('同一身份更新原账号，保留接入配置、模型权限及停用意图。'):'')+'<div class="flow-mock"><div class="flow-mock-label">外部授权模拟器 · 不属于正式产品界面</div><select id="auth-identity" data-identity aria-label="模拟返回的身份">'+options([['same','同一账号的可靠身份'],['unknown','身份依据暂缺'],['different','另一账号（重新授权时会冲突）']],session.identity)+'</select><div class="flow-actions">'+button('返回授权成功','authComplete')+button('返回拒绝','authDenied')+button('响应丢失','authLost')+'</div></div>';
      foot=button('停止等待并关闭','close')+(['unknown','identity'].includes(session.status)?button('查询授权结果','checkAuth',{},'primary'):['denied','conflict'].includes(session.status)?button('重新登录','retryAuth',{},'primary'):'');
    }
  }else if(s.sheet==='import'){
    heading='导入认证文件';body='<p class="flow-help">直接上传 JSON 或粘贴内容；成功项进入当前列表，失败项单独处理。本原型只载入合成样例。</p><div class="flow-actions">'+button('选择示例文件','importSample')+button('粘贴示例 JSON','importSample')+'</div>'+(s.importRows.length?'<div class="inline-workspace"><div class="inline-body">'+s.importRows.map(r=>'<div style="padding:10px 0"><strong style="font-size:12px">'+esc(r.name)+'</strong><div class="flow-help">'+(r.status==='saved'?'已保存 · '+(s.pending.length?'配置待应用':'配置已生效'):r.error||'待导入')+'</div></div>').join('')+'</div></div>':note('示例批次：一个已有账号、一份新的授权文件，以及一个格式不完整的文件。'));
    foot=button('返回列表','viewAccounts')+(s.importRows.some(r=>r.status==='invalid'&&r.error)?button('修正失败示例','fixImport'):'')+button(s.importRows.some(r=>r.status==='saved')?'仅重试未成功项':'导入','submitImport',{},'primary');
  }else if(s.sheet==='detail'&&a){
    heading=a.name;
    body='<div class="segment" role="tablist">'+[['overview','概况'],['models','模型']].map(([id,t])=>'<button role="tab" aria-selected="'+(s.tab===id)+'" data-action="tab" data-params="'+esc(JSON.stringify({tab:id}))+'">'+t+'</button>').join('')+'</div>';
    if(s.tab==='models')body+=note(a.catalog==='stale'?'上次目录：昨天 14:20。本次读取失败，保留旧目录。':'演示目录 · 刚刚读取。目录结果不等于调用通过。',a.catalog==='stale'?'warn':'')+'<div class="flow-model"><div><strong>演示模型 A</strong><div class="flow-help">本原型中由当前账号提供</div></div><label><span class="flow-help">客户端开放范围</span><select id="model-scope" data-model-scope>'+scopeOptions(s.scopeChoice??a.scope)+'</select></label></div><p class="flow-help">更改权限是独立操作，已有权限在你保存前保持不变。暂不开放不影响账号授权的保存。</p><div class="flow-actions">'+button('更新模型目录','refreshModels',{id:a.id})+'</div>',foot=button('关闭','close')+button('保存模型权限','saveScope',{id:a.id},'primary');
    else{
      const st=AccountFlow.status(a);body+=note('<strong>'+esc(st[0])+'</strong><br>'+esc(st[1]),st[2])+defs([['授权',a.auth==='expired'?'需要重新授权':'已保存 · 演示身份'],['配置生效',a.applied?'已生效':a.applyFailed?'应用失败':'待生效'],['接入配置',a.connection+' · '+(a.url||'官方地址')],['模型目录',a.catalog==='stale'?'陈旧 · 昨天 14:20':'已读取 · 演示结果'],['模型权限',scopeLabel(a.scope)],['额度',quota(a)+(a.quotaExhausted?'；耗尽限制仍保留':'')],['调用证据',a.test?'仅模拟 '+a.test+'，真实调用未验证':'尚无真实调用证据'],['在途请求',a.inFlight+' 条；停用后自然结束'],['历史记录',s.historyCount+' 条合成记录，删除账号仍保留']])+ '<div class="flow-actions">'+(AccountFlow.channel(a.channel).kind==='api'?button('编辑配置','editApi',{id:a.id}):button('重新授权','login',{id:a.id,channel:a.channel}))+button('更新额度','refreshQuota',{id:a.id})+button('测试调用','test',{id:a.id})+'</div><details><summary>高级诊断</summary>'+defs([['本地隔离',a.isolation?'有本地调度阻断':'无'],['停用意图',a.disabled?'停用':'启用'],['运行启停',a.activeDisabled?'已停用':'允许参与调度'],['授权修订',a.revision+'（演示）'],['观察来源','合成数据，不是线上状态']])+button('解除本地隔离…','recovery',{id:a.id},'compact')+'</details>';
      foot=button('关闭','close')+button(a.disabled?'启用账号':'停用账号','toggle',{id:a.id})+button('删除账号','delete',{id:a.id},'danger');
    }
  }else if(s.sheet==='delete'&&a){
    heading='删除 '+a.name;body=note('删除当前账号及其关联。共享接入配置和其他账号不会连带删除。','warn')+defs([['影响范围',a.name+' → '+a.connection],['在途请求',a.inFlight+' 条继续执行'],['保留内容','历史请求、用量、账本、共享连接及其他账号'],['历史配置','旧版本可能保留凭据；恢复旧配置时必须再次提示'],['上游授权','本操作不撤销上游 token 或注销账号']]);foot=button('取消','close')+button('确认删除','confirmDelete',{},'danger');
  }else if(s.sheet==='review'){
    heading='待应用修改';body=note('本次保存结果已保留。以下修改需要一起核对后生效。')+'<ul style="padding-left:20px;margin:20px 0;font-size:13px">'+s.pending.map(p=>'<li style="padding:9px 0">'+esc(p.label)+'</li>').join('')+'</ul>'+(s.reviewRevision!==s.draftRevision?note('核对期间清单发生变化，请重新读取。','warn'):'')+'<details><summary>演示并发修改</summary>'+button('模拟其他地方新增修改','concurrentEdit')+'</details>';
    foot=button('保留待应用','keepPending')+(s.reviewRevision!==s.draftRevision?button('重新读取清单','reviewLatest',{},'primary'):button('核对完成，一并应用','apply',{},'primary'));
  }else if(s.sheet==='test'&&a){heading='测试调用 · '+a.name;body=note('正式产品会发送推理请求，可能消耗额度。本原型仅模拟。')+defs([['模型','演示模型 A'],['接入配置',a.connection]])+'<label class="flow-field"><span>下游协议</span><select id="test-protocol" data-field="protocol">'+options(['Chat Completions','Messages','Responses'].map(v=>[v,v]),f.protocol)+'</select></label>';foot=button('取消','close')+button('模拟测试','runTest',{},'primary');
  }else if(s.sheet==='recovery'&&a){heading='解除本地隔离';body=note('只允许此账号与连接再次尝试。不会更新授权或余额，不发送推理测试。','warn')+defs([['目标',a.name+' → '+a.connection],['结果','允许再次尝试，尚未验证'],['限制','不绕过停用、明确授权失效和未到期额度']]);foot=button('取消','close')+button('确认解除','confirmRecovery',{},'primary');}
  $('sheet-content').style.display='contents';$('sheet-content').innerHTML='<header class="flow-dialog-head"><h2 id="sheet-title">'+esc(heading)+'</h2>'+button('关闭','close',{},'compact')+'</header><div class="flow-dialog-body">'+body+'</div><footer class="flow-dialog-foot">'+foot+'</footer>';
}
function render(){
  renderPage();
  const pending=state.pending.length;$('flow-dock').hidden=!pending;$('draft-text').textContent=pending+' 项修改待应用';$('shell').dataset.draft=String(Boolean(pending));$('flow-context').textContent='离线原型 · 第二版';
  document.querySelectorAll('[data-view]').forEach(x=>{if(x.dataset.view===state.view)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});
  document.querySelector('.crumb b').textContent=({accounts:'账号管理',providers:'API 配置',oauth:'授权登录'})[state.view];
  $('lab-body').innerHTML='<label>场景数据 <select id="demo-scene" data-scene>'+options([['normal','日常账号列表'],['empty','首次接入 · 空列表'],['drafts','多连接与已有待应用修改'],['lifecycle','停用与删除 · 两条在途请求'],['native','原生渠道应用失败']],state.scene)+'</select></label><div class="flow-help">请通过正常页面入口操作。以下按钮仅注入演示状态；优先作用于最近查看的账号。</div><div class="flow-actions">'+[['授权失效','expired'],['目录陈旧','stale'],['额度读取失败','quotaFailure'],['额度耗尽','exhausted'],['本地隔离','isolated'],['下一次应用失败','applyFailure'],['一条在途结束','finish']].map(([t,k])=>button(t,'lab',{kind:k},'compact')).join('')+'</div>';
  const dialog=$('flow-sheet');if(state.sheet){renderSheet();if(!dialog.open)dialog.showModal();}else if(dialog.open)dialog.close();
}
function dispatch(action,value={}){const oldView=state.view;state=AccountFlow.transition(state,action,value);render();if(oldView!==state.view||action==='scenario')$('canvas').scrollTop=0;}
document.addEventListener('click',event=>{
  const nav=event.target.closest('[data-view]');if(nav){event.preventDefault();dispatch('view',{view:nav.dataset.view});$('rail').dataset.open='false';return;}
  const target=event.target.closest('button');if(!target)return;
  if(target.dataset.shell==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return;}
  if(target.dataset.shell==='nav'){$('rail').dataset.open=String($('rail').dataset.open!=='true');return;}
  if(target.dataset.action)dispatch(target.dataset.action,target.dataset.params?JSON.parse(target.dataset.params):{});
});
document.addEventListener('change',event=>{
  const t=event.target,id=t.id;
  if(t.hasAttribute('data-field'))dispatch('field',{name:t.dataset.field,value:t.value});
  else if(t.hasAttribute('data-api-channel'))dispatch('apiChannel',{channel:t.value});
  else if(t.hasAttribute('data-identity'))dispatch('authIdentity',{value:t.value});
  else if(t.hasAttribute('data-model-scope'))dispatch('modelScope',{value:t.value});
  else if(t.hasAttribute('data-filter'))dispatch('filter',{value:t.value});
  else if(t.hasAttribute('data-query'))dispatch('query',{value:t.value});
  else if(t.hasAttribute('data-scene'))dispatch('scenario',{scene:t.value});
  if(id&&$(id))$(id).focus();
});
$('flow-sheet').addEventListener('cancel',event=>{event.preventDefault();dispatch('close');});
render();
</script>
</body></html>
