function bindChart(){const area=$('#chart-area'),tip=$('#chart-tooltip');if(!area)return;area.addEventListener('pointermove',e=>{const r=area.getBoundingClientRect(),values=chartValues();const i=Math.max(0,Math.min(values.length-1,Math.round((e.clientX-r.left)/r.width*(values.length-1))));tip.textContent=`时间桶 ${i+1} · ${state.chart==='requests'?fmt(values[i])+' 次请求':'演示平均耗时'}`;tip.hidden=false;tip.style.left=Math.min(r.width-155,Math.max(0,e.clientX-r.left+10))+'px';tip.style.top='12px';});area.addEventListener('pointerleave',()=>tip.hidden=true);}

function costCard(){const s=snapshot();return `<section class="panel cost-panel"><div class="panel-head"><div><h2>费用完整性</h2><small>请求与账本使用同一时间范围</small></div>${icon('info')}</div><div class="cost-number">${(s.exact/s.ledger*100).toFixed(1)}<small>%</small></div><p class="footnote">账本记录的精确计价占比</p><div class="price-track"><i style="width:${s.exact/s.ledger*100}%"></i><i style="width:${s.partial/s.ledger*100}%"></i><i style="width:${s.unpriced/s.ledger*100}%"></i></div><div class="cost-fact"><span><span class="dot"></span>精确计价</span><strong>${fmt(s.exact)} 条</strong></div><div class="cost-fact"><span><span class="dot" style="color:#90b5df"></span>部分已知</span><strong>${fmt(s.partial)} 条</strong></div><div class="cost-fact"><span><span class="dot" style="color:var(--amber)"></span>尚未计价</span><strong>${fmt(s.unpriced)} 条</strong></div><div class="divider"></div><p class="footnote">账本共 ${fmt(s.ledger)} 条，可能晚于请求完成。未计价不是零费用。</p><a class="btn text" style="font-size:11px;margin-top:12px" href="${scopedLink('usage')}">查看用量与计价 ${icon('arrow','arrow')}</a></section>`;}

function providersView(){return header('提供商','保留来源上下文，从接入直接进入模型目录。',`<button class="btn primary" onclick="showProviderEditor()">${icon('plus')} 接入提供商</button>`)+`<div class="dual-columns"><section class="panel panel-pad"><div class="panel-head"><div><h2>已接入提供商</h2><small>接口、账号与模型连接分层维护</small></div>${badge('5 个演示来源')}</div>${providers.map(p=>`<div class="provider-row"><div class="group"><span class="provider-symbol">${p.symbol}</span><span class="provider-name">${p.name}<small>${p.method}</small></span></div><div class="tiny-stat">${models.filter(m=>m.source===p.name&&m.open).length} 个模型<small>演示配置计数</small></div><button class="btn text" style="font-size:10px" onclick="openProviderModels('${p.name}')">模型目录</button>${icon('chevron','arrow')}</div>`).join('')}</section><aside class="panel aside-panel"><h2>接入不等于开放</h2><p>添加提供商后，仍需从明确来源选择模型、保存草稿并应用。不会自动扩大现有 API 密钥的权限。</p><div class="divider"></div><h3>建议的工作顺序</h3><div class="detail-rows"><div class="detail-row"><span>1</span><strong>接入与绑定账号</strong></div><div class="detail-row"><span>2</span><strong>选择模型来源</strong></div><div class="detail-row"><span>3</span><strong>核对并应用配置</strong></div><div class="detail-row"><span>4</span><strong>显式授权客户端密钥</strong></div></div></aside></div>${state.inline==='provider'?providerEditor():''}`;}
function openProviderModels(name){state.modelTab='catalog';state.modelProvider=name;go('models',{source:name,tab:'catalog'});}
function showProviderEditor(){state.inline='provider';render();$('.inline-workspace')?.scrollIntoView({block:'start',behavior:'smooth'});$('#provider-name')?.focus();}
function providerEditor(){return `<form class="inline-workspace" onsubmit="event.preventDefault();saveProviderDemo()"><div class="inline-head"><h2>接入提供商</h2>${badge('保存至草稿','blue')}</div><div class="inline-body"><div class="scope-note">以下字段只用于演示，不进行连接测试或推理。复杂接入流程保留在页内。</div><label class="field">名称<input id="provider-name" required placeholder="例如：备用 API 来源" maxlength="100"></label><label class="field">接口地址<input id="provider-url" type="url" required placeholder="https://gateway.example.invalid/v1"></label><label class="field">协议<select><option>OpenAI-compatible · Chat Completions</option><option>OpenAI Responses</option><option>Anthropic Messages</option></select></label><p class="notes">下一步再选择账号和模型；此处不要求输入秘密，也不会自动开放全部模型。</p></div><div class="inline-footer"><small>不会立即影响服务</small><button class="btn" type="button" onclick="discardProviderEditor()">取消</button><button class="btn primary" type="submit">保存演示草稿</button></div></form>`;}
function discardProviderEditor(){if($('#provider-name')?.value||$('#provider-url')?.value){showModal('放弃未保存的输入？','<p>已保存的待应用批次不受影响。只放弃这个提供商表单中的演示输入。</p>','<button class="btn" onclick="closeModal()">继续编辑</button><button class="btn danger" onclick="state.inline=null;closeModal();render()">放弃输入</button>');}else{state.inline=null;render();}}
function saveProviderDemo(){const name=$('#provider-name').value;state.pending++;state.batchRevision++;state.validatedRevision=null;state.inline=null;state.adopted=true;state.extraProvider=name;render();toast('已保存提供商演示草稿；当前服务未改变。');}
function modelsView(){const filtered=models.filter(m=>(state.modelTab==='catalog'||m.open||(state.adopted&&m.pending))&&(state.modelProvider==='all'||m.source===state.modelProvider)&&m.id.toLowerCase().includes(state.modelSearch.toLowerCase()));return header('模型','上游发现、对外开放与当前可用性，是三个不同状态。',`<button class="btn" onclick="toast('只读目录刷新预览；未自动开放模型，也未发起推理。')">${icon('refresh')} 刷新目录</button>`)+`<div class="context-tabs"><button class="${state.modelTab==='open'?'active':''}" onclick="switchModelTab('open')">已开放模型</button><button class="${state.modelTab==='catalog'?'active':''}" onclick="switchModelTab('catalog')">上游目录</button></div><div class="model-source">${icon('server')}<span>${state.modelProvider==='all'?'全部来源':esc(state.modelProvider)+' / 当前来源'} <span class="muted">· 原始模型 ID 与提供商来源同时保留</span></span>${state.modelProvider!=='all'?'<button class="btn text" style="margin-left:auto;font-size:10px" onclick="state.modelProvider=\'all\';render()">清除来源</button>':''}</div><div class="toolbar"><label class="search-field">${icon('search')}<input type="search" placeholder="搜索原始模型 ID" aria-label="搜索模型" value="${esc(state.modelSearch)}" oninput="modelSearch(this.value)"></label><select class="filter-select" aria-label="模型来源" onchange="state.modelProvider=this.value;render()"><option value="all">全部提供商</option>${providers.map(p=>`<option ${state.modelProvider===p.name?'selected':''}>${p.name}</option>`).join('')}</select><span class="spacer"></span><span class="footnote">只展示合成模型 ID</span></div>${state.selectedModels.size?`<div class="batch-bar"><span>已选择 ${state.selectedModels.size} 个模型</span><button class="btn primary" onclick="startModelConnect()">开放所选模型…</button></div>`:''}<section class="panel"><div class="tablewrap"><table class="data-table"><thead><tr>${state.modelTab==='catalog'?'<th class="check-cell"></th>':''}<th>原始模型 ID / 来源</th><th class="hide-mobile">接口协议</th><th>开放状态</th><th class="hide-mobile">运行可用性</th><th></th></tr></thead><tbody>${filtered.map(m=>`<tr>${state.modelTab==='catalog'?`<td class="check-cell"><input type="checkbox" ${m.open||m.pending?'disabled':''} ${state.selectedModels.has(m.id)?'checked':''} aria-label="选择 ${m.id}" onchange="selectModel('${m.id}',this.checked)"></td>`:''}<td><strong class="mono">${m.id}</strong><small>${m.source}</small></td><td class="hide-mobile">${m.protocol}</td><td>${m.open?badge('已开放','blue'):m.pending?badge('草稿待应用','warn'):badge('未开放')}</td><td class="hide-mobile">${m.open?`${m.available} 个可调度账号`:'尚未对外开放'}</td><td><button class="row-action" aria-label="查看 ${m.id} 的模型连接" onclick="inspectModel('${m.id}')">${icon('chevron')}</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><h2>没有匹配模型</h2><p>保留当前筛选；不会用另一个来源的结果覆盖本目录。</p></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>显示 ${filtered.length} 个合成模型</span><span>发现不自动开放 · 开放不自动授权</span></div></section>${state.inline==='models'?modelConnectEditor():''}`;}
function switchModelTab(tab){state.modelTab=tab;state.selectedModels.clear();render();}
function modelSearch(v){state.modelSearch=v;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const focus=document.activeElement;const pos=focus?.selectionStart;render();const el=$('[aria-label="搜索模型"]');el?.focus();try{el?.setSelectionRange(pos,pos)}catch(e){}},200);}
function selectModel(id,on){on?state.selectedModels.add(id):state.selectedModels.delete(id);render();}
function inspectModel(id){const m=models.find(x=>x.id===id);showModal('模型连接',`<p class="mono" style="overflow-wrap:anywhere;color:var(--ink)">${m.id}</p><div class="detail-rows"><div class="detail-row"><span>提供商</span><strong>${m.source}</strong></div><div class="detail-row"><span>接口协议</span><strong>${m.protocol}</strong></div><div class="detail-row"><span>公开模型状态</span>${badge(m.open?'已开放':'未开放',m.open?'blue':'')}</div><div class="detail-row"><span>可用性</span><strong>${m.open?m.available+' 个演示账号':'未开放，不推断可用'}</strong></div></div><p>模型 ID 原样保留。若来自多个提供商，分别展示来源与账号可用性，不合并配额或凭据状态。</p>`,`<button class="btn" onclick="closeModal()">关闭</button>${!m.open?`<button class="btn primary" onclick="state.selectedModels.add('${m.id}');closeModal();startModelConnect()">开放此模型…</button>`:''}`,'drawer');}
function startModelConnect(){state.inline='models';render();$('.inline-workspace')?.scrollIntoView({block:'start',behavior:'smooth'});}
function modelConnectEditor(){return `<section class="inline-workspace"><div class="inline-head"><h2>开放所选模型</h2>${badge('配置草稿','blue')}</div><div class="inline-body"><p class="notes">核对来源与原始模型 ID。保存后仍需在「配置与发布」校验并应用。当前密钥权限不会自动扩大。</p>${[...state.selectedModels].map(id=>{const m=models.find(x=>x.id===id);return `<div class="diff-row"><strong class="mono">${m.id}</strong><p style="margin-left:0">${m.source} → ${m.protocol} → 明确的账号连接</p></div>`}).join('')}<div class="scope-note warn" style="margin-top:20px">此为演示批次。最终能否服务仍取决于活动配置、密钥权限及运行时可用性。</div></div><div class="inline-footer"><small>不会自动发布，也不会自动签发密钥</small><button class="btn" onclick="state.inline=null;render()">返回选择</button><button class="btn primary" onclick="saveModelsDemo()">保存到工作草稿</button></div></section>`;}
function saveModelsDemo(){state.addedModels=[...new Set([...(state.addedModels||[]),...state.selectedModels])];state.selectedModels.forEach(id=>models.find(m=>m.id===id).pending=true);state.pending+=state.selectedModels.size;state.batchRevision++;state.validatedRevision=null;state.adopted=true;state.selectedModels.clear();state.inline=null;render();toast('已保存演示草稿。模型仍未在活动服务中开放。');}
function requestsView(){const filter=state.requestFilter;let rows=requests.filter(r=>(filter==='all'||r.status===filter)&&`${r.model}${r.provider}`.includes(state.requestSearch));const q=new URLSearchParams(location.hash.split('?')[1]||'');if(q.has('account'))rows=rows.filter(r=>r.account===Number(q.get('account')));if(state.scenario==='empty'||state.scenario==='error')rows=[];return header('请求日志','从请求终态出发，再展开每次尝试与关联证据。',rangeControl())+`<div class="scope-note"><span class="muted">当前查看</span> · ${q.has('from_ms')?'来自概览的精确时间范围已保留':'演示快照'} <span class="muted">｜请求终态与上游尝试分别计数；未观测不当作成功。</span></div><div class="toolbar"><label class="search-field">${icon('search')}<input type="search" placeholder="搜索模型或提供商" aria-label="搜索请求" value="${esc(state.requestSearch)}" oninput="requestSearch(this.value)"></label><select class="filter-select" aria-label="请求结果筛选" onchange="state.requestFilter=this.value;render()">${[['all','全部结果'],['succeeded','成功'],['failed','失败'],['cancelled','已取消'],['unknown','终态未知']].map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select><span class="spacer"></span><button class="btn" onclick="exportRequests()">${icon('download')} 导出演示记录</button></div><section class="panel"><div class="tablewrap"><table class="data-table"><thead><tr><th>模型 / 时间</th><th class="hide-mobile">渠道 / 账号</th><th>结果</th><th class="hide-mobile">总耗时 / 首内容</th><th class="hide-mobile">费用 · 微单位</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong class="mono">${r.model}</strong><small>${r.time}</small></td><td class="hide-mobile">${r.provider}<small>${accounts[r.account].name}</small></td><td>${badge(...requestStatus[r.status],true)}<small>${r.attempts} 次上游尝试</small></td><td class="hide-mobile">${r.duration===null?'—':fmt(r.duration)+' ms'}<small>${r.first===null?'首内容未观测':r.first+' ms'}</small></td><td class="hide-mobile">${r.cost===null?'未计价':r.cost}<small>${r.cost===null?'不是零费用':'演示计价记录'}</small></td><td><button class="row-action" onclick="inspectRequest('${r.id}')" aria-label="查看请求 ${r.id}">${icon('chevron')}</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><h2>${state.scenario==='error'?'请求数据读取失败':'此筛选下没有请求记录'}</h2><p>调整筛选或重新读取，不自动发送新推理。</p></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>显示 ${rows.length} 条演示请求 · 非全窗口请求总数</span><span>敏感内容不展示</span></div></section>`;}
function requestSearch(v){state.requestSearch=v;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();$('[aria-label="搜索请求"]')?.focus()},200);}
function inspectRequest(id){const r=requests.find(x=>x.id===id);showModal('请求详情',`<p class="mono" style="color:var(--ink);overflow-wrap:anywhere">${r.model}</p>${badge(...requestStatus[r.status],true)}<div class="detail-rows"><div class="detail-row"><span>总耗时</span><strong>${r.duration===null?'未观测':r.duration+' ms'}</strong></div><div class="detail-row"><span>首内容延迟</span><strong>${r.first===null?'未观测':r.first+' ms'}</strong></div><div class="detail-row"><span>费用 · 微单位</span><strong>${r.cost===null?'未计价':r.cost}</strong></div></div><h3 style="margin:24px 0 18px">上游尝试链</h3><ol class="timeline">${Array.from({length:r.attempts},(_,i)=>`<li><strong>尝试 ${i+1} · ${r.attempts>1&&i===0?'上游不可用':r.status==='succeeded'?'已建立上游响应':r.status==='failed'?'凭据拒绝':'保留观测结果'}</strong><p>${r.provider} · ${accounts[r.account].name}</p></li>`).join('')}</ol><div class="scope-note">上游已建立响应，不等于完整请求最终成功。终态以请求记录为准。</div><details><summary class="notes">精确引用</summary><p class="mono" style="margin-top:10px">${r.id}</p></details>`,`<button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();go('accounts',{provider:'${r.provider}'})">查看关联账号</button>`,'drawer');}
function exportRequests(){const blob=new Blob([requests.map(r=>JSON.stringify({...r,example_only:true})).join('\n')],{type:'application/x-ndjson'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='prism-demo-requests.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 6 条明确标记为演示的记录。');}
function usageView(){const s=snapshot();return header('用量与费用','把已知金额、计价置信度和未计价记录放在一起看。',rangeControl())+`<div class="context-tabs"><button class="active">用量分析</button><button onclick="priceCatalogPreview()">价格目录</button></div>${kpis()}<div class="dual-columns"><section class="panel panel-pad"><div class="panel-head"><div><h2>费用来源</h2><small>合成账本按模型归类 · 不是客户端账单</small></div>${badge('运营者计价','blue')}</div><div class="tablewrap"><table class="data-table"><thead><tr><th>模型</th><th>已知费用 · 微单位</th><th>计价状态</th></tr></thead><tbody>${[['demo-codex-main',.43],['demo-claude-sonnet',.34],['demo-grok-build',.14],['demo-kiro-code',.09]].map(([name,share])=>`<tr><td class="mono">${name}</td><td>${fmt(Math.round(s.cost*share))}</td><td>${badge('已知部分','blue')}</td></tr>`).join('')}<tr><td class="mono">demo-compatible-reasoning</td><td>—</td><td>${badge('缺少价格','warn')}</td></tr></tbody></table></div><div class="divider"></div><p class="notes">费用没有明确币种契约，因此不擅自添加 ¥ 或 $。后台整数微单位作为精确值保留；展示可缩写为 M 微单位。账本记录与请求数不要求一一相等。</p><a href="${scopedLink('requests')}" class="btn text" style="margin-top:12px">查看同范围请求 ${icon('arrow','arrow')}</a></section>${costCard()}</div>`;}
function priceCatalogPreview(){showModal('价格目录 · 独立全局数据','<p>目录导入或恢复独立保存，并按自己的生效时间参与计价。不进入配置发布批次，不因放弃草稿而删除，也不改写历史账本。</p><div class="scope-note">价格表批量编辑应使用页内工作区、完整预览和分页校验。这个原型仅展示入口与操作边界。</div>','<button class="btn primary" onclick="closeModal()">知道了</button>');}
function keysView(){return header('API 密钥','每把密钥都有明确的模型边界。创建后秘密只显示一次。',`<button class="btn primary" onclick="createKeyPreview()">${icon('plus')} 创建密钥</button>`)+`<section class="panel"><div class="tablewrap"><table class="data-table"><thead><tr><th>名称</th><th class="hide-mobile">秘密</th><th>模型权限</th><th class="hide-mobile">状态</th><th></th></tr></thead><tbody>${[['开发工具','demo-codex-main'],['写作工作区','demo-claude-sonnet'],['研究客户端','demo-grok-build']].map(([name,model])=>`<tr><td><strong>${name}</strong><small>演示客户端密钥</small></td><td class="hide-mobile muted">不可回读</td><td class="mono">${model}<small>1 个显式允许模型</small></td><td class="hide-mobile">${badge('活动配置','good')}</td><td><button class="row-action" onclick="keyDetails('${name}','${model}')" aria-label="查看 ${name} 权限">${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot">模型开放不会自动扩大这些密钥的权限。不要在演示页面输入任何真实秘密。</div></section>`;}

  clearTimeout(toastTimer);const t=$('#toast');
  t.getAnimations().forEach(a=>a.cancel());
  const done=/通过|完成|已重新载入|已生成/.test(text);
  t.innerHTML=icon(done?'check':'info')+`<span class="toast-text">${esc(text)}</span><button class="toast-close" aria-label="关闭反馈" onclick="dismissToast()">${icon('x')}</button>`;
  t.hidden=false;
  subtleAnimate(t,[{opacity:0,transform:'translateX(-50%) translateY(7px) scale(.985)'},{opacity:1,transform:'translateX(-50%) translateY(0) scale(1)'}],'select');
  toastTimer=setTimeout(dismissToast,5200);
};
function dismissToast() {clearTimeout(toastTimer);$('#toast').hidden=true;}
refreshDemo = async function refreshLiquidDemo(button) {
  const b=button||document.querySelector('[onclick="refreshDemo(this)"]')||document.querySelector('[onclick="refreshDemo(this)"]');
  if(!b||b.disabled) return;
  const id=++liquid2.refreshId,baseline=[state.page,state.period,state.scenario].join('|');
  const html=b.innerHTML,label=b.getAttribute('aria-label');
  b.disabled=true;b.setAttribute('aria-busy','true');b.setAttribute('aria-label','模拟读取中');
  b.innerHTML='<span class="spin-mark" aria-hidden="true"></span>';
  // A labelled offline simulation; never a source of production truth.
  await new Promise(r=>setTimeout(r,650));
  if(id!==liquid2.refreshId||!b.isConnected||baseline!==[state.page,state.period,state.scenario].join('|'))return;
  b.removeAttribute('aria-busy');b.setAttribute('aria-label','演示快照已载入');b.innerHTML=icon('check');
  toast('已载入同一份演示快照。没有连接网关，数值不作虚假递增。');
  setTimeout(()=>{if(b.isConnected){b.innerHTML=html;b.disabled=false;if(label)b.setAttribute('aria-label',label);}},1000);
};
toggleTheme = function toggleLiquidTheme() {
  liquid2.baseTheme();
  subtleAnimate($('#theme-button svg'),[{transform:'rotate(-35deg)',opacity:.5},{transform:'rotate(0deg)',opacity:1}],'fast');
  updateLabPreferences();
};
function setMotionPreference() {
  state.lowMotion=!state.lowMotion;document.body.classList.toggle('reduce-motion',state.lowMotion);
  if(!motionOK())cancelDecorativeMotion();
  if(!$('#modal').open&&state.page==='settings')render();
  updateLabPreferences();
}
function setGlassPreference() {
  state.lowGlass=!state.lowGlass;document.body.classList.toggle('reduce-glass',state.lowGlass);
  updateLabPreferences();
}
function updateLabPreferences() {
  const defs=[['lab-lowglass',state.lowGlass],['lab-lowmotion',state.lowMotion||liquid2.reduced.matches],['lab-dark',state.theme==='dark']];
  defs.forEach(([id,on])=>{const el=document.getElementById(id);if(el){el.setAttribute('aria-checked',String(on));el.classList.toggle('on',on);}});
  const m=$('#lab-lowmotion');if(m){m.disabled=liquid2.reduced.matches;m.title=liquid2.reduced.matches?'系统已启用减少动态效果，页面不会覆盖此偏好。':'';}
  const note=$('#lab-motion-note');if(note)note.textContent=motionOK()?'按压 110ms · 选择 210ms · 面板 240ms':'减少动态效果：状态立即切换，保留文字与色彩反馈。';
}
settingsView = function liquidSettings() {
  const marker='<h3 class="section-label">连接与会话</h3>';
  const extra=`<section class="panel" style="margin-top:14px"><div class="settings-row"><div><strong>减少动态效果</strong><p>停用位移、缩放与弹性。系统偏好优先，仍保留清楚的操作回执。</p></div><button role="switch" aria-checked="${state.lowMotion||liquid2.reduced.matches}" aria-label="减少动态效果" class="toggle ${state.lowMotion||liquid2.reduced.matches?'on':''}" ${liquid2.reduced.matches?'disabled':''} onclick="setMotionPreference()"></button></div><div class="settings-row"><div><strong>材质与动效预览</strong><p>比较按钮、共享选择滑块与状态反馈。本页偏好仅在当前内存中生效。</p></div><button class="btn" onclick="openPolishLab()">打开预览 ${icon('arrow','arrow')}</button></div></section>`;
  return liquid2.baseSettings().replace(marker,extra+marker);
};
function openPolishLab() {
  showModal('材质与动效',`
    <div class="lab-hero"><div><div class="lab-eyebrow">PRISM / LIQUID REFINEMENT</div><h3>轻盈，但每次操作都有回应。</h3><p>导航承载光感，内容保持清晰。按钮、选择与回执共用一套克制的动效语言。</p></div><div class="lab-swatch"><div>${icon('diff')} 工作草稿 ${badge('演示','blue')}</div><button class="btn primary" onclick="previewButtonState(this)">${icon('check')} 预览状态反馈</button></div></div>
    <div class="lab-grid">
      <section class="lab-cell"><h3>01 / 按钮层级</h3><p>蓝色主操作、珠光次操作、轻量文字操作。</p><div class="lab-actions"><button class="btn primary" onclick="previewButtonState(this)">${icon('plus')} 主要操作</button><button class="btn" onclick="previewInlineFeedback('次操作已响应；未改变任何配置。')">次要操作</button><button class="btn text" onclick="previewInlineFeedback('文字按钮适合次级入口，不与主操作争抢注意。')">了解详情 ${icon('arrow','arrow')}</button></div><p class="lab-readout">悬停抬升 1px · 按压缩放 0.975</p></section>
      <section class="lab-cell"><h3>02 / 连续的选择</h3><p>背景滑块移动，标签位置保持稳定。</p><div class="tabs lab-tabs" aria-label="预览时间范围"><button class="active" onclick="selectLabTab(this,0)">24 小时</button><button onclick="selectLabTab(this,1)">7 天</button><button onclick="selectLabTab(this,2)">30 天</button></div><p class="lab-readout" id="lab-tab-note">当前：24 小时。只改变预览选择，不改变真实查询。</p></section>
      <section class="lab-cell"><h3>03 / 可读的状态回执</h3><p>状态变化后再反馈，不让动画替数据宣布成功。</p><button class="btn" onclick="previewInlineFeedback('演示校验通过。真实服务没有变化。',true)">${icon('shield')} 预览校验反馈</button><div class="lab-status" role="status" aria-live="polite" id="lab-status">${icon('info')}<span>等待预览操作 · 全部离线</span></div></section>
      <section class="lab-cell"><h3>04 / 外观与辅助功能</h3><div class="lab-preference"><span>深色外观</span><button id="lab-dark" class="toggle" role="switch" aria-checked="false" aria-label="预览深色外观" onclick="toggleTheme()"></button></div><div class="lab-preference"><span>减少透明度</span><button id="lab-lowglass" class="toggle" role="switch" aria-checked="false" aria-label="预览减少透明度" onclick="setGlassPreference()"></button></div><div class="lab-preference"><span>减少动态效果</span><button id="lab-lowmotion" class="toggle" role="switch" aria-checked="false" aria-label="预览减少动态效果" onclick="setMotionPreference()"></button></div></section>
    </div><p class="lab-bottom" id="lab-motion-note"></p>`,
    `<span class="footnote" style="margin-right:auto;align-self:center">离线预览 · 不操作网关</span><button class="btn primary" onclick="closeModal()">返回工作台 ${icon('arrow','arrow')}</button>`,'polish-lab');
  updateLabPreferences();
}
function selectLabTab(button,index) {
  const g=button.closest('.tabs'),r=segmentRects(g.parentElement);
  g.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));
  decorateSegments(g.parentElement,r);
  $('#lab-tab-note').textContent=`当前：${['24 小时','7 天','30 天'][index]}。只改变预览选择，不改变真实查询。`;
}
function previewInlineFeedback(text,success=false) {
  const line=$('#lab-status');if(!line)return;
  line.innerHTML=icon(success?'check':'info')+'<span>'+esc(text)+'</span>';
  subtleAnimate(line,[{opacity:.3,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],'fast');
}
async function previewButtonState(button) {
  if(button.disabled||button.dataset.running)return;
  const modalId=liquid2.modalId,html=button.innerHTML,oldWidth=button.style.width;
  button.dataset.running='true';button.style.width=button.getBoundingClientRect().width+'px';
  button.disabled=true;button.setAttribute('aria-busy','true');button.innerHTML='<span class="spin-mark" aria-hidden="true"></span> 演示中';
  previewInlineFeedback('正在模拟异步反馈，没有发起请求。');
  await new Promise(r=>setTimeout(r,750));
  if(!button.isConnected||modalId!==liquid2.modalId)return;
  button.removeAttribute('aria-busy');button.innerHTML=icon('check')+' 演示完成';
  previewInlineFeedback('演示已完成。成功标识只在模拟结果返回后出现。',true);
  subtleAnimate(button.querySelector('.icon'),[{opacity:0,transform:'scale(.82)'},{opacity:1,transform:'scale(1)'}],'fast');
  setTimeout(()=>{if(button.isConnected){button.innerHTML=html;button.disabled=false;button.style.width=oldWidth;delete button.dataset.running;}},1400);
}
liquid2.reduced.addEventListener('change',()=>{if(!motionOK())cancelDecorativeMotion();updateLabPreferences();if(state.page==='settings'&&!$('#modal').open)render();});
let liquidScrollFrame=0;
window.addEventListener('scroll',()=>{if(liquidScrollFrame)return;liquidScrollFrame=requestAnimationFrame(()=>{$('.topbar').classList.toggle('is-scrolled',window.scrollY>16);liquidScrollFrame=0;});},{passive:true});
window.addEventListener('resize',()=>{requestAnimationFrame(()=>{
  decorateSegments();$('#nav .nav-sled')?.remove();decorateNav(null);
  // Resize only the chart geometry: never remount a form or replay a task.
  const svg=$('#chart-area svg');
  if(svg && Number(svg.viewBox.baseVal.width)!==(innerWidth<=760?330:690)) {
    const temp=document.createElement('div');temp.innerHTML=chartMarkup();
    svg.replaceWith(temp.querySelector('#chart-area svg'));
  }
});});
render();

</script>
</body>
