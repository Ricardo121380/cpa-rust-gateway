<!doctype html>
<html lang="zh-CN" data-theme="light" data-transparency="glass" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism 网关控制台 · 工作台原型</title>
<style>
/* ============================ tokens ============================ */
:root{
  --canvas: oklch(0.945 0.008 250);
  --tint: oklch(0.978 0.005 250 / 0.84);
  --surface: oklch(0.988 0.003 250);
  --surface-2: oklch(0.952 0.007 250);
  --fg: oklch(0.25 0.015 265);
  --fg-2: oklch(0.43 0.018 262);
  --muted: oklch(0.52 0.015 260);
  --border: oklch(0.855 0.01 255);
  --border-strong: oklch(0.76 0.012 255);
  --accent: oklch(0.515 0.175 256);
  --accent-hover: oklch(0.45 0.16 256);
  --accent-fg: oklch(0.985 0.003 250);
  --accent-soft: oklch(0.515 0.175 256 / 0.12);
  --success: oklch(0.575 0.125 152);
  --warn: oklch(0.62 0.12 80);
  --danger: oklch(0.545 0.175 25);
  --glass-bg: oklch(0.972 0.005 250 / 0.68);
  --glass-border: oklch(1 0 0 / 0.55);
  --shadow: 0 1px 2px oklch(0.2 0.02 265 / 0.05), 0 10px 30px oklch(0.2 0.02 265 / 0.08);
  --shadow-lg: 0 2px 6px oklch(0.2 0.02 265 / 0.06), 0 24px 64px oklch(0.2 0.02 265 / 0.16);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme="dark"]{
  --canvas: oklch(0.175 0.012 264);
  --tint: oklch(0.24 0.014 264 / 0.84);
  --surface: oklch(0.25 0.014 264);
  --surface-2: oklch(0.3 0.015 264);
  --fg: oklch(0.93 0.005 255);
  --fg-2: oklch(0.79 0.01 258);
  --muted: oklch(0.68 0.012 260);
  --border: oklch(1 0 0 / 0.1);
  --border-strong: oklch(1 0 0 / 0.2);
  --accent: oklch(0.72 0.13 250);
  --accent-hover: oklch(0.79 0.12 250);
  --accent-fg: oklch(0.17 0.015 264);
  --accent-soft: oklch(0.72 0.13 250 / 0.18);
  --success: oklch(0.73 0.12 152);
  --warn: oklch(0.79 0.11 85);
  --danger: oklch(0.71 0.15 25);
  --glass-bg: oklch(0.225 0.013 264 / 0.72);
  --glass-border: oklch(1 0 0 / 0.12);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 10px 30px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 2px 8px oklch(0 0 0 / 0.45), 0 24px 64px oklch(0 0 0 / 0.55);
}
/* ============================ base ============================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  font-size:14px;line-height:1.6;
  color:var(--fg);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{ /* 与玻璃铬件一致的极浅着色底，非装饰性渐变 */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% -20%, oklch(0.6 0.1 250 / 0.07), transparent 60%);
}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
h1{font-size:23px;font-weight:590;line-height:1.35;letter-spacing:0}
h2{font-size:16px;font-weight:590;line-height:1.4}
.mono{font-family:var(--mono);font-size:0.92em;letter-spacing:0}
.muted{color:var(--muted)}
/* ============================ glass material ============================ */
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:saturate(1.7) blur(22px);
  backdrop-filter:saturate(1.7) blur(22px);
}
[data-transparency="reduced"] .glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
[data-transparency="reduced"] body::before{display:none}
/* ============================ app shell ============================ */
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:236px 1fr;height:100vh;position:relative;z-index:1}
/* ---- topbar ---- */
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--border);position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;min-height:44px}
.brand-mark{width:22px;height:22px;border-radius:7px;flex:none;align-self:center;
  background:linear-gradient(135deg,var(--accent),oklch(0.68 0.14 250));
  box-shadow:inset 0 1px 1px oklch(1 0 0 / 0.4), 0 2px 6px oklch(0.5 0.15 256 / 0.35);}
.brand b{font-size:15px;font-weight:590}
.brand span{font-size:12px;color:var(--muted)}
.demo-chip{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;
  padding:5px 12px;letter-spacing:0.04em;white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill-pending{display:none;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;
  border:1px solid var(--border-strong);font-size:12.5px;font-weight:510;color:var(--fg)}
.pill-pending .dot{background:var(--warn)}
.pill-pending.on{display:inline-flex}
.pill-pending:hover{background:var(--surface-2)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
/* ---- sidebar ---- */
.sidebar{border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;z-index:20}
.nav-item{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border-radius:10px;
  color:var(--fg-2);font-size:13.5px;font-weight:510;letter-spacing:0.02em;width:100%;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.sidebar-foot{margin-top:18px;padding:12px 12px 4px;font-size:11px;color:var(--muted);letter-spacing:0.04em;border-top:1px solid var(--border)}
/* ---- bottom nav (mobile) ---- */
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto;gap:2px}
.bottombar .nav-item{flex-direction:column;gap:3px;min-height:52px;min-width:64px;padding:4px 6px;font-size:10.5px;flex:none}
/* ---- main ---- */
.main{overflow-y:auto;padding:28px 32px 64px;position:relative}
.page{max-width:1080px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-head .eyebrow{font-size:11px;letter-spacing:0.16em;color:var(--muted);font-weight:590;margin-bottom:6px}
.page-head p.desc{color:var(--muted);font-size:13px;margin-top:5px;max-width:62ch}
/* ============================ components ============================ */
.panel{background:var(--tint);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-pad{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border)}
.panel-head h2{display:flex;align-items:center;gap:10px}
.count-badge{font-size:11.5px;font-weight:510;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 9px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;
  border-radius:11px;font-size:13.5px;font-weight:590;letter-spacing:0.02em;border:1px solid transparent;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn-ghost{border-color:var(--border-strong);color:var(--fg);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-text{color:var(--accent);min-height:44px;padding:0 10px}
.btn-text:hover{background:var(--accent-soft)}
.btn:disabled{opacity:0.42;cursor:not-allowed;transform:none}
.btn-sm{min-height:36px;padding:0 13px;font-size:12.5px;border-radius:9px}
/* chips & dots */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:510;letter-spacing:0.02em;
  color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--success)}.dot.warn{background:var(--warn)}.dot.err{background:var(--danger)}.dot.idle{background:var(--muted)}
.status-ok{color:var(--success)}.status-warn{color:var(--warn)}.status-err{color:var(--danger)}
/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{font-size:11.5px;font-weight:590;letter-spacing:0.06em;color:var(--muted);text-align:left;
  padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:0 16px;border-bottom:1px solid var(--border);height:48px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--surface-2)}
/* forms */
.field{margin-bottom:18px}
.field label{display:block;font-size:12.5px;font-weight:510;color:var(--fg-2);margin-bottom:7px;letter-spacing:0.02em}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.field .error-msg{display:none;font-size:12px;color:var(--danger);margin-top:6px}
.field.invalid .error-msg{display:block}
.field.invalid .input{border-color:var(--danger)}
.input{width:100%;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--border-strong);
  background:var(--surface);font-size:13.5px;transition:border-color .15s, box-shadow .15s}
.input::placeholder{color:var(--muted)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.input{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.radio-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;border:1px solid var(--border);
  border-radius:11px;cursor:pointer;margin-bottom:8px;background:var(--surface);transition:border-color .12s,background .12s}
.radio-row:hover{border-color:var(--border-strong)}
.radio-row.sel{border-color:var(--accent);background:var(--accent-soft)}
.radio-row input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.radio-row .rr-main{flex:1;min-width:0}
.radio-row .rr-name{font-size:13.5px;font-weight:510}
.radio-row .rr-sub{font-size:11.5px;color:var(--muted)}
/* segmented */
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:4px}
.seg button{flex:1;min-height:36px;border-radius:8px;font-size:12.5px;font-weight:510;color:var(--fg-2)}
.seg button.sel{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
/* stat tiles */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px 18px}
.stat .s-label{font-size:11.5px;color:var(--muted);letter-spacing:0.05em;margin-bottom:8px}
.stat .s-value{font-size:26px;font-weight:590;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s-sub{font-size:11.5px;color:var(--muted);margin-top:5px}
/* bar chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:132px;padding:8px 4px 0}
.chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.85;
  height:calc(var(--v) / var(--max) * 100%);min-height:3px}
.chart .bar-lab{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
/* empty / skeleton */
.empty{padding:56px 24px;text-align:center}
.empty .e-title{font-size:14px;font-weight:590;margin:12px 0 5px}
.empty p{font-size:12.5px;color:var(--muted)}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.3s infinite linear}
@keyframes shimmer{to{background-position:-200% 0}}
[data-motion="reduced"] .sk{animation:none}
[data-motion="reduced"] *{transition-duration:.01ms !important}
/* ============================ modal ============================ */
.modal-overlay{position:fixed;inset:0;z-index:100;background:oklch(0.2 0.02 265 / 0.32);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
[data-transparency="reduced"] .modal-overlay{-webkit-backdrop-filter:none;backdrop-filter:none}
.modal{width:100%;max-width:480px;max-height:calc(100vh - 60px);display:flex;flex-direction:column;
  border-radius:18px;border:1px solid var(--glass-border);box-shadow:var(--shadow-lg)}
.modal.wide{max-width:600px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px 14px}
.modal-head h2{font-size:16.5px}
.modal-body{padding:4px 22px 18px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.modal-foot .foot-note{margin-right:auto;font-size:11.5px;color:var(--muted);line-height:1.5}
.discard-bar{display:flex;align-items:center;gap:10px;width:100%;font-size:12.5px;color:var(--warn)}
/* ============================ inspector ============================ */
.inspector{position:fixed;top:56px;right:0;bottom:0;width:392px;max-width:100vw;z-index:60;
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);
  transform:translateX(105%);transition:transform .28s cubic-bezier(.32,.72,.24,1);display:flex;flex-direction:column}
.inspector.open{transform:translateX(0)}
.insp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--border)}
.insp-body{padding:18px 22px;overflow-y:auto;flex:1}
.insp-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.spec-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.spec-row:last-child{border-bottom:0}
.spec-row dt{color:var(--muted);flex:none}
.spec-row dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.insp-section{font-size:11px;letter-spacing:0.14em;color:var(--muted);font-weight:590;margin:20px 0 6px}
/* ============================ receipts ============================ */
.receipts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px;width:392px;max-width:calc(100vw - 36px)}
.receipt{border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:14px 16px 13px;background:var(--surface)}
.receipt .r-top{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:590;letter-spacing:0.05em;margin-bottom:6px}
.receipt .r-title{font-size:13.5px;font-weight:590;margin-bottom:3px}
.receipt .r-body{font-size:12px;color:var(--fg-2);line-height:1.6}
.receipt .r-meta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.receipt .r-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.receipt .r-close:hover{background:var(--surface-2);color:var(--fg)}
.receipt{position:relative}
.receipt .r-close svg{width:14px;height:14px}
/* ============================ pricing editor ============================ */
.price-cell{font-variant-numeric:tabular-nums;font-weight:510}
.price-cell.null{color:var(--muted);font-weight:400}
td.editable{cursor:text;position:relative}
td.editable:hover{box-shadow:inset 0 0 0 1.5px var(--border-strong)}
td.editing{box-shadow:inset 0 0 0 1.5px var(--accent)}
td .cell-input{width:92px;min-height:34px;padding:0 10px;border:0;background:var(--surface);border-radius:8px;
  font:inherit;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1.5px var(--accent)}
td.cell-error{box-shadow:inset 0 0 0 1.5px var(--danger)}
tr.row-dirty td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.pager{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.pager .pg-btns{margin-left:auto;display:flex;gap:8px}
/* diff list in preview */
.diff-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.diff-row:last-child{border-bottom:0}
.diff-row .d-model{font-family:var(--mono);font-size:12px;width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff-row .d-field{color:var(--muted);width:76px;flex:none;font-size:12px}
.diff-row .d-old{color:var(--muted);text-decoration:line-through}
.diff-row .d-arrow{color:var(--muted)}
.diff-row .d-new{font-weight:590;font-variant-numeric:tabular-nums}
/* batch list */
.batch-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.batch-item:last-child{border-bottom:0}
.batch-item .b-kind{flex:none;margin-top:3px}
.batch-item .b-sum{font-weight:510}
.batch-item .b-detail{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.55}
/* filter input */
.filter-row{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.filter-row .input{max-width:300px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
/* ============================ responsive ============================ */
@media (max-width:1180px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottombar{display:flex}
  .main{padding:16px 12px 110px}
  .demo-chip{display:none}
  .inspector{width:100vw;border-left:0}
  .page-head{align-items:flex-start;flex-direction:column;gap:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .brand span{display:none}
}
@media (max-width:480px){.stat-grid{grid-template-columns:1fr 1fr}.stat .s-value{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar glass" data-od-id="topbar">
    <div class="brand" data-od-id="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <b>Prism</b><span>AI 网关控制台</span>
    </div>
    <span class="demo-chip">演示环境 · 全部数据为合成样例</span>
    <div class="topbar-right">
      <button class="pill-pending" id="pendingPill" data-od-id="pending-pill" aria-label="查看待应用批次">
        <span class="dot"></span><span id="pendingText">待应用 · 0</span>
      </button>
      <button class="icon-btn" id="transparencyBtn" data-od-id="transparency-toggle" title="切换透明度：玻璃 / 降低透明" aria-label="切换透明度"></button>
      <button class="icon-btn" id="themeBtn" data-od-id="theme-toggle" title="切换浅色 / 深色" aria-label="切换主题"></button>
    </div>
  </header>
  <nav class="sidebar glass" id="sidebar" data-od-id="sidebar" aria-label="主导航"></nav>
  <main class="main" id="view" data-od-id="view" tabindex="-1"></main>
</div>
<nav class="bottombar glass" id="bottombar" data-od-id="bottombar" aria-label="主导航（移动端）"></nav>
<aside class="inspector glass" id="inspector" data-od-id="inspector" aria-label="详情检查器" hidden></aside>
<div id="modalRoot"></div>
<div class="receipts" id="receipts" data-od-id="receipts" aria-live="polite"></div>

<script>
(function(){

function statusChip(s, text){

function renderAcctGroups(){
  var q = S.acctFilter.trim().toLowerCase();
  var wrap = $("#acctGroups"); if(!wrap) return;
  var groups = {};
  S.accounts.forEach(function(a){
    var ch = CHANNELS.filter(function(c){return c.id===a.ch;})[0];
    if (q && a.email.toLowerCase().indexOf(q)<0 && ch.group.toLowerCase().indexOf(q)<0) return;
    (groups[ch.group] = groups[ch.group]||{ch:ch, items:[]}).items.push(a);
  });
  var names = Object.keys(groups);
  if (!names.length){
    wrap.innerHTML = '<div class="panel empty" data-od-id="accounts-empty">'+
      '<div class="e-title">没有匹配的账号</div><p>当前筛选「'+esc(S.acctFilter)+'」没有结果。</p>'+
      '<button class="btn btn-ghost btn-sm" id="clearAcctFilter" style="margin-top:14px">清除筛选</button></div>';
    $("#clearAcctFilter").addEventListener("click", function(){ S.acctFilter=""; $("#acctFilter").value=""; renderAcctGroups(); });
    return;
  }
  wrap.innerHTML = names.map(function(g){
    var grp = groups[g];
    var rows = grp.items.map(function(a){
      var stMap = {ok:["ok","正常"], idle:["idle","已暂停"], err:["err","授权异常"]};
      var st = stMap[a.status];
      return '<tr><td><span class="mono">'+esc(a.email)+'</span></td>'+
        '<td><span class="chip">'+esc(grp.ch.proto)+'</span></td>'+
        '<td>'+statusChip(st[0], st[1])+'</td>'+
        '<td style="text-align:right"><button class="btn-text btn-sm" disabled title="演示原型不提供此操作">管理</button></td></tr>';
    }).join("");
    return '<div class="panel" style="margin-bottom:16px" data-od-id="acct-group-'+grp.ch.id+'">'+
      '<div class="panel-head"><h2>'+esc(g)+' <span class="count-badge">'+grp.items.length+'</span></h2>'+
      '<span class="chip">'+esc(grp.ch.proto)+'</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>账号邮箱</th><th>协议</th><th>状态</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  }).join("");
}

function bindPricing(){
  var seg = $("#polSeg"), mult = $("#polMult"), submit = $("#polSubmit");
  Array.prototype.forEach.call(seg.querySelectorAll("button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(seg.querySelectorAll("button"), function(x){ x.classList.remove("sel"); x.setAttribute("aria-checked","false"); });
      b.classList.add("sel"); b.setAttribute("aria-checked","true");
      S.policy.strategy = b.getAttribute("data-v");
    });
  });
  mult.addEventListener("input", function(){ submit.disabled = mult.value.trim()===""; });
  submit.addEventListener("click", function(){
    var v = parseFloat(mult.value);
    if (isNaN(v)){ return; }
    var stratMap={cost:"成本优先",balanced:"均衡",latency:"延迟优先"};
    var scopeMap={all:"全部模型",std:"仅标准计费类",long:"仅长上下文类"};
    S.policy.multiplier = v;
    S.batch.push({ id:++batchSeq, kind:"policy",
      summary:"路由价格策略草稿",
      detail:stratMap[S.policy.strategy]+"策略 · 倍率 "+v+"× · 作用域 "+scopeMap[$("#polScope").value],
      valid:function(){ return v>=0.5 && v<=5; } });
    addReceipt("draft","策略草稿已存入批次","路由价格策略（倍率 "+v+"×）进入待应用批次，共 "+S.batch.length+" 项。它与价格目录相互独立。");
    renderTopbar();
    mult.value=""; submit.disabled=true;
  });
  Array.prototype.forEach.call(document.querySelectorAll("td.editable"), function(td){
    function startEdit(){
      if (td.classList.contains("editing")) return;
      td.classList.add("editing");
      var mName = td.getAttribute("data-m"), field = td.getAttribute("data-f");
      var row = S.prices.filter(function(r){return r.m===mName;})[0];
      var cur = (S.priceEdits[mName]||{})[field];
      var old = cur!==undefined ? cur : row[field];
      td.innerHTML = "";
      var inp = el('<input class="cell-input" type="number" min="0" step="0.1" aria-label="价格输入">');
      inp.value = old==null ? "" : old;
      td.appendChild(inp); inp.focus(); inp.select();
      var done = false;
      function commit(cancel){
        if (done) return; done = true;
        td.classList.remove("editing");
        var v = parseFloat(inp.value);
        if (cancel || inp.value.trim()===""){
          renderCell(td, mName, field);
          return;
        }
        if (isNaN(v) || v < 0){
          td.classList.add("cell-error");
          renderCell(td, mName, field);
          addReceipt("info","输入未生效","价格必须是不小于 0 的数字；「"+mName+"」的该单元格已恢复原值。");
          setTimeout(function(){ td.classList.remove("cell-error"); }, 1200);
          return;
        }
        S.priceEdits[mName] = S.priceEdits[mName] || {};
        S.priceEdits[mName][field] = v;
        PAGES.pricing();
      }
      inp.addEventListener("blur", function(){ commit(false); });
      inp.addEventListener("keydown", function(e){
        if (e.key==="Enter"){ e.preventDefault(); commit(false); }
        else if (e.key==="Escape"){ e.stopPropagation(); commit(true); }
      });
    }
    td.addEventListener("click", startEdit);
    td.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); startEdit(); } });
  });
  var saveBtn = $("#priceSave");
  if (saveBtn) saveBtn.addEventListener("click", openPricePreview);
}
function renderCell(td, mName, field){
  var row = S.prices.filter(function(r){return r.m===mName;})[0];
  var e = S.priceEdits[mName]||{};
  td.innerHTML = fmtPrice(e[field]!==undefined ? e[field] : row[field]);
}
function openPricePreview(){
  var diffs = [];
  Object.keys(S.priceEdits).forEach(function(mName){
    var row = S.prices.filter(function(r){return r.m===mName;})[0];
    var e = S.priceEdits[mName];
    [["pin","输入"],["pout","输出"],["pcache","缓存读取"]].forEach(function(pair){
      var f=pair[0];
      if (e[f]===undefined) return;
      var oldV = row[f]==null ? "— 未定价" : "¥ "+row[f];
      diffs.push('<div class="diff-row"><span class="d-model">'+esc(mName)+'</span><span class="d-field">'+pair[1]+'</span>'+
        '<span class="d-old">'+oldV+'</span><span class="d-arrow">→</span><span class="d-new">¥ '+e[f]+'</span></div>');
    });
  });
  if (!diffs.length) return;
  var m = mountModal(
    '<div class="modal-head"><h2>确认保存价格目录</h2><button class="icon-btn" data-close aria-label="关闭">'+icon("x")+'</button></div>'+
    '<div class="modal-body"><p class="muted" style="font-size:12.5px;margin-bottom:10px">共 '+diffs.length+' 处修改，保存后对全部调用方全局生效：</p>'+diffs.join("")+
    '<p class="muted" style="font-size:11.5px;margin-top:12px;line-height:1.6">此操作不影响「路由价格策略」草稿；两者相互独立，不会静默绑定。</p></div>'+
    '<div class="modal-foot"><span class="foot-note">全局保存立即生效，不进入待应用批次。</span>'+
    '<button class="btn btn-ghost" data-close>返回修改</button>'+
    '<button class="btn btn-primary" id="priceConfirm" data-od-id="price-confirm">确认全局保存</button></div>', true);
  $("#priceConfirm", m).addEventListener("click", function(){
    Object.keys(S.priceEdits).forEach(function(mName){
      var row = S.prices.filter(function(r){return r.m===mName;})[0];
      var e = S.priceEdits[mName];
      if(e.pin!==undefined) row.pin=e.pin;
      if(e.pout!==undefined) row.pout=e.pout;
      if(e.pcache!==undefined) row.pcache=e.pcache;
    });
    var n = Object.keys(S.priceEdits).length;
    S.priceEdits = {};
    closeModal(m, true);
    addReceipt("saved","价格目录已全局保存", n+" 个模型条目的修改已生效。路由价格策略草稿保持独立，未被改动。");
    if (S.page==="pricing") PAGES.pricing();
  });
}

/* ---- 设置 ---- */
PAGES.settings = function(){
  function seg(id, opts, current){
    return '<div class="seg" id="'+id+'" role="radiogroup">'+opts.map(function(o){
      return '<button data-v="'+o[0]+'" role="radio" aria-checked="'+(o[0]===current)+'" class="'+(o[0]===current?"sel":"")+'">'+o[1]+'</button>';
    }).join("")+'</div>';
  }
  $("#view").innerHTML =
  '<div class="page" data-od-id="page-settings">'+
    '<div class="page-head"><div><div class="eyebrow">系统</div><h1>设置</h1>'+
    '<p class="desc">外观偏好仅保存在内存中，刷新页面后恢复默认，不写入浏览器存储。</p></div></div>'+
    '<div class="panel panel-pad" style="max-width:560px" data-od-id="appearance-panel">'+
      '<div class="field"><label>主题</label>'+seg("segTheme",[["light","浅色"],["dark","深色"]], document.documentElement.getAttribute("data-theme"))+'</div>'+
      '<div class="field"><label>透明度</label>'+seg("segTrans",[["glass","玻璃材质"],["reduced","降低透明"]], document.documentElement.getAttribute("data-transparency"))+'</div>'+
      '<div class="field" style="margin-bottom:6px"><label>动效</label>'+seg("segMotion",[["full","完整动效"],["reduced","减弱动效"]], document.documentElement.getAttribute("data-motion"))+'</div>'+
    '</div>'+
    '<div class="panel panel-pad" style="max-width:560px;margin-top:16px"><h2 style="margin-bottom:8px">关于本原型</h2>'+
    '<p style="font-size:12.5px;color:var(--fg-2);line-height:1.8">Prism 网关控制台 v7 工作台方向原型。单文件 HTML，零外部依赖，全部数据为合成样例；所有写操作均为演示，不访问任何真实服务、凭据或账号。</p></div>'+
  '</div>';
  function bindSeg(id, attr){
    var segEl = $("#"+id);
    Array.prototype.forEach.call(segEl.querySelectorAll("button"), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(segEl.querySelectorAll("button"), function(x){ x.classList.remove("sel"); x.setAttribute("aria-checked","false"); });
        b.classList.add("sel"); b.setAttribute("aria-checked","true");
        document.documentElement.setAttribute(attr, b.getAttribute("data-v"));
        renderTopbar();
      });
    });
  }
  bindSeg("segTheme","data-theme");
  bindSeg("segTrans","data-transparency");
  bindSeg("segMotion","data-motion");
};

/* ============================ modal system ============================ */
var openModals = [];
function mountModal(innerHTML, wide){
  var overlay = el('<div class="modal-overlay" role="presentation"></div>');
  var modal = el('<div class="modal glass'+(wide?" wide":"")+'" role="dialog" aria-modal="true">'+innerHTML+'</div>');
  overlay.appendChild(modal);
  $("#modalRoot").appendChild(overlay);
  openModals.push({overlay:overlay, modal:modal});
  Array.prototype.forEach.call(modal.querySelectorAll("[data-close]"), function(b){
    b.addEventListener("click", function(){ requestClose(modal); });
  });
  overlay.addEventListener("mousedown", function(e){ if(e.target===overlay) requestClose(modal); });
  modal.addEventListener("keydown", function(e){
    if (e.key!=="Tab") return;
    var f = Array.prototype.filter.call(modal.querySelectorAll("button,input,select,[tabindex]"), function(n){ return !n.disabled && n.offsetParent!==null; });
    if (!f.length) return;
    var first=f[0], last=f[f.length-1];
    if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
  modal.__returnFocus = document.activeElement;
  return modal;
}
function requestClose(modal){
  if (modal.__dirty && modal.__dirty() && !modal.__confirming){
    modal.__confirming = true;
    var bar = el('<div class="discard-bar" style="padding:10px 22px;border-top:1px solid var(--border)">'+icon("alert")+'<span style="flex:1">有未保存的修改，确定关闭？</span>'+
      '<button class="btn btn-ghost btn-sm" data-keep>继续编辑</button>'+
      '<button class="btn btn-primary btn-sm" data-discard>放弃修改</button></div>');
    var foot = modal.querySelector(".modal-foot");
    modal.insertBefore(bar, foot);
    bar.querySelector("[data-keep]").addEventListener("click", function(){ bar.remove(); modal.__confirming=false; });
    bar.querySelector("[data-discard]").addEventListener("click", function(){ closeModal(modal, true); });
    bar.querySelector("[data-keep]").focus();
    return;
  }
  closeModal(modal, false);
}
function closeModal(modal, force){
  var rec = null;
  for (var i=0;i<openModals.length;i++) if (openModals[i].modal===modal){ rec=openModals.splice(i,1)[0]; break; }
  if (!rec) return;
  rec.overlay.remove();
  var rf = modal.__returnFocus;
  if (rf && rf.focus) try{ rf.focus({preventScroll:true}); }catch(e){}
}
/* ============================ batch: 校验并应用 ============================ */
function openBatchModal(){
  if (!S.batch.length) return;
  var items = S.batch.map(function(b){
    return '<div class="batch-item"><span class="b-kind">'+(b.kind==="policy"?icon("pricing"):icon("providers"))+'</span>'+
      '<div><div class="b-sum">'+esc(b.summary)+'</div><div class="b-detail">'+esc(b.detail)+'</div></div></div>';
  }).join("");
  var m = mountModal(
    '<div class="modal-head"><h2>待应用批次 · '+S.batch.length+' 项</h2><button class="icon-btn" data-close aria-label="关闭">'+icon("x")+'</button></div>'+
    '<div class="modal-body" id="batchBody">'+items+
    '<p class="muted" style="font-size:11.5px;margin-top:12px;line-height:1.6">校验失败的项会保留在批次中，其余项正常生效；应用期间按 <span class="kbd">Esc</span> 取消，取消后结果未知且不会自动重放。</p></div>'+
    '<div class="modal-foot"><span class="foot-note">高级配置统一校验后生效。</span>'+
    '<button class="btn btn-ghost" id="batchClear">清空批次</button>'+
    '<button class="btn btn-primary" id="batchApply" data-od-id="batch-apply">校验并应用</button></div>', true);
  $("#batchClear", m).addEventListener("click", function(){
    S.batch = [];
    closeModal(m, true);
    addReceipt("info","批次已清空","所有待应用项已放弃，未产生任何写入。");
    renderTopbar();
  });
  $("#batchApply", m).addEventListener("click", function(){
    var body = $("#batchBody", m), applyBtn = $("#batchApply", m), clearBtn = $("#batchClear", m);
    applyBtn.disabled = true; clearBtn.disabled = true;
    body.innerHTML = '<div style="display:flex;align-items:center;gap:12px;padding:26px 4px">'+
      '<div class="sk" style="width:18px;height:18px;border-radius:50%;flex:none"></div>'+
      '<div style="font-size:13px">正在校验并应用 '+S.batch.length+' 项…<br><span class="muted" style="font-size:11.5px">按 Esc 取消 —— 取消后结果未知，系统不会自动重放。</span></div></div>';
    S.applying = true;
    var timer = setTimeout(function(){
      if (!S.applying) return;
      S.applying = false;
      var failed = S.batch.filter(function(b){ return !b.valid(); });
      var passed = S.batch.length - failed.length;
      S.batch = failed;
      closeModal(m, true);
      if (!failed.length){
        addReceipt("saved","批次已全部应用", passed+" 项配置校验通过并已生效。");
      } else {
        addReceipt("partial","批次部分完成", passed+" 项已生效；"+failed.length+" 项校验失败并保留在批次中："+failed.map(function(f){return "「"+f.summary+"」";}).join("、")+"。请修正后重新应用。");
      }
      renderTopbar();
    }, 1400);
    m.__applyAbort = function(){
      if (!S.applying) return;
      S.applying = false;
      clearTimeout(timer);
      closeModal(m, true);
      addReceipt("uncertain","应用结果未知","你在应用完成前取消了操作。已发出的写入状态无法确认——系统不会自动重放该批次，请核对实际状态后手动重试。批次中的 "+S.batch.length+" 项保持不变。");
      renderTopbar();
    };
  });
}
/* ============================ receipts ============================ */
var RECEIPT_KINDS = {
  saved:    {label:"已全局保存", cls:"ok",   color:"var(--success)"},
  draft:    {label:"草稿待应用", cls:"warn", color:"var(--accent)"},
  partial:  {label:"部分完成",   cls:"warn", color:"var(--warn)"},
  uncertain:{label:"结果未知",   cls:"err",  color:"var(--danger)"},
  info:     {label:"提示",       cls:"idle", color:"var(--muted)"}
};
function addReceipt(kind, title, body){
  var k = RECEIPT_KINDS[kind] || RECEIPT_KINDS.info;
  var r = el('<div class="receipt" data-od-id="receipt-'+kind+'" role="status">'+
    '<div class="r-top" style="color:'+k.color+'"><span class="dot '+k.cls+'"></span>'+k.label+'</div>'+
    '<div class="r-title">'+title+'</div><div class="r-body">'+body+'</div>'+
    '<div class="r-meta"><span>'+nowStr()+' · 演示环境</span><span>合成数据 · 无真实写入</span></div>'+
    '<button class="r-close" aria-label="关闭回执">'+icon("x")+'</button></div>');
  r.querySelector(".r-close").addEventListener("click", function(){ r.remove(); });
  $("#receipts").appendChild(r);
  var all = document.querySelectorAll(".receipt");
  if (all.length>4) all[0].remove();
}
/* ============================ global keyboard ============================ */
document.addEventListener("keydown", function(e){
  if (e.key!=="Escape") return;
  var top = openModals[openModals.length-1];
  if (top){
    if (top.modal.__applyAbort && S.applying){ e.preventDefault(); top.modal.__applyAbort(); }
    else requestClose(top.modal);
    return;
  }
  if ($("#inspector").classList.contains("open")) closeInspector();
});
/* ============================ topbar toggles ============================ */
$("#themeBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
  renderTopbar();
});
$("#transparencyBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-transparency");
  document.documentElement.setAttribute("data-transparency", cur==="glass"?"reduced":"glass");
  renderTopbar();
});
$("#pendingPill").addEventListener("click", openBatchModal);
/* ============================ boot ============================ */
renderNav(); renderTopbar(); go("dashboard");
})();
</script>
