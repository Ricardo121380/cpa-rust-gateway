name: ci

# This workflow is the ordinary PR/main safety net.  It deliberately does not run the
# expensive Fast or supply-chain jobs: those belong to delivery-gate.yml and require an
# explicit phase closeout, tag, or manual dispatch.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Classify lightweight scope
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths fail-closed
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF_TYPE: ${{ github.ref_type }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: ./scripts/classify-ci-change.sh

  docs:
    name: Docs-only lightweight gate
    needs: classify
    if: needs.classify.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install docs prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run docs-only checks
        run: ./scripts/check.sh docs

  code:
    name: Lightweight compile gate
    needs: classify
    if: needs.classify.outputs.scope == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_VERSION: "24.19.0"
      NPM_VERSION: "11.17.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install lightweight native prerequisites
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev ripgrep
      - name: Install pinned Node.js and restore the npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/admin-ui/package-lock.json
      - name: Verify pinned Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Install locked management SPA dependencies
        working-directory: web/admin-ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Run repository safety checks
        run: |
          set -euo pipefail
          ./scripts/check.sh docs
          ./scripts/check-shell-syntax.sh
          ruby scripts/check-ci-workflow.rb
          ruby scripts/check-release-artifact-workflow.rb
          ./scripts/test-ci-change-classifier.sh
          ./scripts/check-source-policy.rb
          ./scripts/check-crate-boundaries.rb
          ./scripts/secret-scan.sh --all
      - name: Check formatting and compile all workspace targets
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets --all-features

  required:
    name: Required lightweight gate
    needs: [classify, docs, code]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify lightweight path
        env:
          SCOPE: ${{ needs.classify.outputs.scope }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CODE_RESULT: ${{ needs.code.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          case "$SCOPE" in
            docs)
              test "$DOCS_RESULT" = "success"
              test "$CODE_RESULT" = "skipped"
              ;;
            code)
              test "$DOCS_RESULT" = "skipped"
              test "$CODE_RESULT" = "success"
              ;;
            *)
              printf 'unknown lightweight scope: %s\n' "$SCOPE" >&2
              exit 1
              ;;
          esac
